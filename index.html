    .abcjs-beam-elem { fill: #0f172a !important; opacity: 1 !important; }

    .abcjs-staff, path.abcjs-staff, line.abcjs-staff, .abcjs-staff-line {

    .abcjs-inline-audio { margin: 0; padding: 4px; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .abcjs-inline-audio .abcjs-btn {

    const parseChord = (chordStr) => {
      if (!chordStr) return { name: "Cmaj7", rootPc: 0, isMajor: true, roots: [36, 48] };
      const match = chordStr.match(/^[A-G][#b]?/);
      const root = match ? match[0] : 'C';
      const rootPc = PITCH_CLASSES[root] || 0;
      const type = chordStr.substring(root.length);
      
      const isMinor = type.includes('m') && !type.includes('maj');
      const isMajor = type.includes('maj') || type.includes('M7') || type.includes('△') || type === '';
      const isDim = type.includes('dim') || type.includes('m7b5');
      const isV7 = type.includes('7') && !isMinor && !isMajor && !isDim;

      let roots = [];
      for (let oct of [1, 2, 3]) { 
         let midi = rootPc + (oct * 12) + 12; 
         if (midi >= MIN_BASS_MIDI && midi <= MAX_BASS_MIDI - 8) {
             roots.push(midi);
         }
      }
      if (roots.length === 0) roots = [36];

      return { name: chordStr, rootPc, isMajor, isMinor, isV7, isDim, roots };

      const t = String(name || '').substring(m ? m[0].length : 0);
      if (t.includes('dim')) return 'dim';
      if (t.includes('m7b5') || t.includes('ø')) return 'hdim';
      if (t.includes('maj') || t.includes('M7') || t.includes('△')) return 'maj';
      if (t.includes('m')) return 'min';
      if (t.includes('7')) return 'dom';
      return 'maj';

      else if (durType === "2.5") { durBeat = 2.5; abcDur = "4-"; tiedTail = true; } // 2分音符＋タイ8分音符
      else if (durType === "2") { durBeat = 2.0; abcDur = "4"; }
      else if (durType === "2.") { durBeat = 3.0; abcDur = "6"; }
      else if (durType === "2..") { durBeat = 3.5; abcDur = "7"; }
      else if (durType === "1") { durBeat = 4.0; abcDur = "8"; }
      else if (durType === "q8") { // 5連符（8分×5＝2拍）
        durBeat = 0.4; abcDur = "";
        if (tripCounter === 0) prefix = "(5:4:5";
        tripCounter = (tripCounter + 1) % 5;
      }
      else if (durType === "8") { durBeat = 0.5; abcDur = ""; }
      else if (durType === "16") { durBeat = 0.25; abcDur = "/2"; }
      else if (durType === "trip8") {
        durBeat = 1 / 3; abcDur = "";
        if (tripCounter === 0) prefix = "(3";
        tripCounter = (tripCounter + 1) % 3;
      } else if (durType === "trip16") {
        durBeat = 1 / 6; abcDur = "/2";
        if (tripCounter === 0) prefix = "(3";
        tripCounter = (tripCounter + 1) % 3;
      }
      return { durBeat, abcDur, isRest, prefix, tiedTail, tripCounter };
    };

    // 重み付きランダム選択（Donna Lee由来フレーズを優先）
    const pickWeighted = (list) => {
      const w = list.map(c => (c.cell && typeof c.cell.w === "number") ? c.cell.w : ((c.cell && c.cell.authentic) ? DONNA_WEIGHT : 1));
      let r = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
      return list[list.length - 1];
    };

    const midiToAbcByKey = (midi, keySig, measureAccRef, spell) => {
      const flats = KEY_FLATS[keySig] || [];
      const sharps = KEY_SHARPS[keySig] || [];
      // spell: "b"=♭表記 / "#"=♯表記 / 未指定=調号に従う
      const useFlat = spell === "b" ? true : (spell === "#" ? false : flats.length > 0);
      const pitchClass = midi % 12;
      const oct = Math.floor(midi / 12);

      let baseName = "";
      let targetState = "natural";

      switch (pitchClass) {
        case 0:  baseName = "C"; targetState = "natural"; break;
        case 1:  baseName = useFlat ? "D" : "C"; targetState = useFlat ? "flat" : "sharp"; break;
        case 2:  baseName = "D"; targetState = "natural"; break;
        case 3:  baseName = useFlat ? "E" : "D"; targetState = useFlat ? "flat" : "sharp"; break;
        case 4:  baseName = "E"; targetState = "natural"; break;
        case 5:  baseName = "F"; targetState = "natural"; break;
        case 6:  baseName = useFlat ? "G" : "F"; targetState = useFlat ? "flat" : "sharp"; break;
        case 7:  baseName = "G"; targetState = "natural"; break;
        case 8:  baseName = useFlat ? "A" : "G"; targetState = useFlat ? "flat" : "sharp"; break;
        case 9:  baseName = "A"; targetState = "natural"; break;
        case 10: baseName = useFlat ? "B" : "A"; targetState = useFlat ? "flat" : "sharp"; break;
        case 11: baseName = "B"; targetState = "natural"; break;
      }

      let abc = baseName;
      const abcOctave = Math.floor(midi / 12) - 1; // MIDI 60 => 4, MIDI 48 => 3, MIDI 36 => 2, MIDI 24 => 1
      if (abcOctave <= 1) abc = baseName + ",,,";
      else if (abcOctave === 2) abc = baseName + ",,";
      else if (abcOctave === 3) abc = baseName + ",";
      else if (abcOctave === 4) abc = baseName;
      else if (abcOctave === 5) abc = baseName.toLowerCase();
      else if (abcOctave === 6) abc = baseName.toLowerCase() + "'";
      else abc = baseName.toLowerCase() + "''";

      const defaultState = flats.includes(baseName) ? "flat" : (sharps.includes(baseName) ? "sharp" : "natural");
      const key = baseName + oct;
      const currentState = measureAccRef[key] !== undefined ? measureAccRef[key] : defaultState;

      let prefix = "";
      if (targetState !== currentState) {
        if (targetState === "flat") prefix = "_";
        else if (targetState === "sharp") prefix = "^";
        else if (targetState === "natural") prefix = "=";
        measureAccRef[key] = targetState;
      }

      return prefix + abc;
    };

    // 4弦ベースTABフレット計算 (最大6フレット圏内のボックスポジション＆2ボックス連結最適化)
    const getTabForNote = (midi, isHarm, boxStart, forceString = -1, prevTab = null) => {
      if (isHarm) {
        // 実音MIDI（およびピッチクラス）が完全に一致するナチュラル・ハーモニクスを検索
        let exactMatches = NATURAL_HARMONICS.filter(h => h.midi === midi);
        if (exactMatches.length === 0) {
          exactMatches = NATURAL_HARMONICS.filter(h => h.pc === (midi % 12));
        }
        if (exactMatches.length > 0) {
          let bestH = null;
          const refFret = (prevTab && prevTab.fretNum) ? prevTab.fretNum : 7;
          exactMatches.forEach(h => {
            let score = Math.abs(h.fretNum - refFret) * 0.8 + Math.abs(h.midi - midi) * 2;
            if (prevTab && prevTab.stringIdx !== undefined) {
              score += Math.abs(h.stringIdx - prevTab.stringIdx) * 1.2;
            }
            if (!bestH || score < bestH.score) {
              bestH = { stringIdx: h.stringIdx, fret: h.fret, fretNum: h.fretNum, score };
            }
          });
          return bestH;
        }
      }

      const boxEnd = boxStart + 5; // 最大6フレット圏内 (例: 5F〜10F)
      const boxCenter = boxStart + 2.5;
      let best = null;

      for (let s = 3; s >= 0; s--) {
        const fret = midi - BASS_STRINGS[s];
        if (fret >= 0 && fret <= 20) {
          let score = 0;

          if (fret === 0) {
            // 開放弦は押弦できる別の弦・フレットがあるなら極力使わない（ソロでのポジション移動・ミュート・音色の統一のため）
            // 他に弾ける場所がない音（E1）だけは開放弦を許容する
            const hasAlt = BASS_STRINGS.some((open, s2) => s2 !== s && midi - open >= 1 && midi - open <= 20);
            score += hasAlt ? 200 : 0;
          } else if (fret >= boxStart && fret <= boxEnd) {
            // 6フレット圏内のボックスに収まっている場合
            score += Math.abs(fret - boxCenter) * 0.6;
            if (fret === boxStart || fret === boxEnd) score += 0.6; // 4〜5フレット幅のコア領域をさらに優遇
          } else {
            // 6フレット圏外にはみ出す場合は重いペナルティを課す
            const over = fret < boxStart ? (boxStart - fret) : (fret - boxEnd);
            score += 25 + over * 12;
          }

          // 強制弦指定があっても、ボックスから大きく外れる(2弦1F等になる)場合はボックス内の弦への切り替えを許容する
          if (forceString !== -1 && s !== forceString) {
            score += 12;
          }

          // 直前の音との弦・フレットの繋がりを滑らかにする
          if (prevTab && prevTab.fretNum !== null && prevTab.fretNum !== undefined) {
            score += Math.abs(fret - prevTab.fretNum) * 0.45;
            const strDiff = Math.abs(s - prevTab.stringIdx);
            if (strDiff > 1) score += (strDiff - 1) * 5;
          }

          if (!best || score < best.score) {
            best = { stringIdx: s, fret: String(fret), fretNum: fret, score };
          }
        }
      }
      
      if (!best) return { stringIdx: 0, fret: "0", fretNum: 0, score: 999 };
      return best;
    };

    // 添付ファイル（arpeggio solo etude.html）と同じピアノボイシング伴奏生成
    const getPianoVoicing = (chord, keySig, accRef) => {
      const rPc = chord.rootPc;
      const thirdPc = rPc + (chord.isMinor || chord.isDim ? 3 : 4);
      const seventhPc = rPc + (chord.isMajor ? 11 : 10);

      // C3(48) 付近のルート、C4(60) 付近の3度・7度
      const r = midiToAbcByKey(48 + (rPc % 12), keySig, accRef);
      const t = midiToAbcByKey(60 + (thirdPc % 12), keySig, accRef);
      const s = midiToAbcByKey(60 + (seventhPc % 12), keySig, accRef);

      return `[${r}${t}${s}]4`;
    };

    // 4弦ベース専用SVG TAB譜コンポーネント
    const FourStringBassTab = ({ measures }) => {
      const stringLabels = ["G", "D", "A", "E"];
      return (
        <div className="w-full mt-2 mb-6">
          <svg viewBox="0 0 1150 82" className="w-full h-auto select-none">
            <text x="12" y="25" fill="#0f172a" fontSize="13" fontWeight="800" fontFamily="sans-serif">T</text>
            <text x="12" y="42" fill="#0f172a" fontSize="13" fontWeight="800" fontFamily="sans-serif">A</text>
            <text x="12" y="59" fill="#0f172a" fontSize="13" fontWeight="800" fontFamily="sans-serif">B</text>

            {stringLabels.map((lbl, idx) => (
              <text key={idx} x="30" y={19 + idx * 14} fill="#475569" fontSize="10" fontWeight="700" fontFamily="monospace">
                {lbl}
              </text>
            ))}

            {[0, 1, 2, 3].map((lineIdx) => (
              <line
                key={lineIdx}
                x1="42"
                y1={15 + lineIdx * 14}
                x2="1142"
                y2={15 + lineIdx * 14}
                stroke="#475569"
                strokeWidth="1.2"
              />
            ))}

            <line x1="42" y1="15" x2="42" y2="57" stroke="#0f172a" strokeWidth="2" />

            {measures.map((m, mIdx) => {
              const measureStartX = 42 + mIdx * 275;
              const measureWidth = 275;
              return (
                <g key={mIdx}>
                  {m.notes.map((n, nIdx) => {
                    const xPos = measureStartX + 22 + (n.beatPos / 4.0) * (measureWidth - 34);
                    const lineIdx = 3 - n.tab.stringIdx;
                    const yPos = 15 + lineIdx * 14;
                    
                    // 桁数に応じてテキスト背景の幅を最小限に調整（重なり防止）
                    let textWidth = 10;
                    if (n.tab.fret.length === 2) textWidth = 14;
                    if (n.tab.fret.length >= 3) textWidth = 22;

                    return (
                      <g key={nIdx}>
                        <rect
                          x={xPos - textWidth / 2}
                          y={yPos - 6.5}
                          width={textWidth}
                          height={13}
                          fill="#ffffff"
                        />
                        <text
                          x={xPos}
                          y={yPos + 3.5}
                          textAnchor="middle"
                          fill={n.isHarm ? "#b45309" : "#0f172a"}
                          fontSize="11"
                          fontWeight="800"
                          fontFamily="ui-monospace, SFMono-Regular, Menlo, monospace"
                        >
                          {n.tab.fret}
                        </text>
                      </g>
                    );
                  })}

                  <line
                    x1={measureStartX + measureWidth}
                    y1="15"
                    x2={measureStartX + measureWidth}
                    y2="57"
                    stroke="#0f172a"
                    strokeWidth={mIdx === 3 ? "2" : "1.3"}
                  />
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    function App() {
      const [category, setCategory] = useState("ALL");
      const [allow16th, setAllow16th] = useState(false);
      const [bpm, setBpm] = useState(120);
      const [backingVol, setBackingVol] = useState(70);
      const [isBackingOnly, setIsBackingOnly] = useState(false);
      
      const [currentSong, setCurrentSong] = useState(STANDARD_SONGS[0]);
      const [measureCount, setMeasureCount] = useState(STANDARD_SONGS[0].measures);
      const [chords, setChords] = useState([...STANDARD_SONGS[0].chords]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      
      const [systemsData, setSystemsData] = useState([]);
      const [rawAbcData, setRawAbcData] = useState({ melody: "", comping: "" });
      const [fullAudioAbc, setFullAudioAbc] = useState("");
      const [playerReady, setPlayerReady] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playProgress, setPlayProgress] = useState(0);
      const [loopOn, setLoopOn] = useState(false);
      const [playerError, setPlayerError] = useState("");
      const [isPriming, setIsPriming] = useState(false); // 初回再生時の音声生成中
      const [mixInfo, setMixInfo] = useState(""); // 再生方式の表示（独立ミキサー / abcjs標準）
      const [rebuildKey, setRebuildKey] = useState(0); // ライブ音量が使えない環境で、音量変更時に音声を作り直すためのカウンタ

      // 独自プレイヤー：ベースとピアノを別々のシンセ(+別々のゲイン)で鳴らし、音量を再生中でもリアルタイムに変えられるようにする
      const playerRef = useRef({ ctx: null, bassGain: null, pianoGain: null, bass: null, piano: null, timing: null, started: false, primed: false, token: 0, totalMs: 0, live: true, custom: false, sources: [], bassBuf: null, pianoBuf: null, cOffset: 0, cT0: 0, cPlaying: false });
      const loopRef = useRef(false);
      const isPrimingRef = useRef(false);
      const volRef = useRef({ vol: 70, backingOnly: false });

      const generateEtude = () => {
        let genSystems = [];
        let allAudioMelody = "";
        let allComping = "";
        
        let currentFretCenter = 4; // ボックスポジションの初期開始フレット (4F〜9Fの6フレット圏内)
        let prevLastMidi = null;   // 直前の音程（コードチェンジ時の跳躍を最小化するために追跡）
        let prevLastFret = null;   // 直前のフレット番号（コード境目のポジション移動を最小化）

        const numSystems = Math.ceil(measureCount / 4);

        for (let sysIdx = 0; sysIdx < numSystems; sysIdx++) {
          const sysChordsStr = chords.slice(sysIdx * 4, sysIdx * 4 + 4);
          if (sysChordsStr.length === 0) break;

          let abcHeader = [
            "X:" + (sysIdx + 1),
            ...(sysIdx === 0 ? [`T:${currentSong.title}`] : []),
            "M:4/4",
            "L:1/8",
            `K:${currentSong.key} clef=bass`
          ].join("\n") + "\n";

          let lineAbc = "";
          let lineWords = "w: ";
          let tabMeasures = [];

          sysChordsStr.forEach((chordRaw) => {
            if (!chordRaw) chordRaw = "Cmaj7";
            const [c1Str, c2Str] = chordRaw.split(/\s+/).filter(Boolean);
            const chord1 = parseChord(c1Str);
            const chord2 = c2Str ? parseChord(c2Str) : chord1;

            let measureAbc = `"${chordRaw}"`;
            let measureTabNotes = [];
            let measureAccRef = {};
            const globalMeasureIdx = sysIdx * 4 + tabMeasures.length;
            let measureNotesData = [];
            let cell = null;

            // 完コピ曲（Donna lee (Parker)）の場合はアドリブ生成を行わず、譜面データをそのまま読み込む
            if (currentSong.isTranscription && currentSong.transcriptionBars && currentSong.transcriptionBars[globalMeasureIdx]) {
              const barEvents = currentSong.transcriptionBars[globalMeasureIdx];
              let measureBeat = 0;
              let tripCounter = 0;
              cell = { cat: "Transcription", p: barEvents.map(e => e[0]), d: [], isHarm: false };

              // 前の音からのタイ（同小節内 or 前小節の最後の音）を判定するためのヘルパー
              const prevBarEv = globalMeasureIdx > 0 ? currentSong.transcriptionBars[globalMeasureIdx - 1] : null;
              const hasTie = (ev) => !!(ev && ev[2] && ev[2].includes("-"));

              barEvents.forEach(([durType, trebleMidi, flag], evIdx) => {
                const dur = resolveDuration(durType, tripCounter);
                const { durBeat, abcDur, isRest, prefix, tiedTail } = dur;
                tripCounter = dur.tripCounter;
                const spell = flag ? (flag.includes("b") ? "b" : (flag.includes("#") ? "#" : undefined)) : undefined;
                const tieOut = hasTie([durType, trebleMidi, flag]);
                const prevEv = evIdx > 0 ? barEvents[evIdx - 1] : (prevBarEv ? prevBarEv[prevBarEv.length - 1] : null);
                const isTieTail = hasTie(prevEv);

                const activeChord = measureBeat < 2 ? chord1 : chord2;

                if (isRest) {
                  measureAbc += prefix + abcDur;
                } else {
                  const realMidi = Math.max(MIN_BASS_MIDI, Math.min(MAX_BASS_MIDI, trebleMidi - 24));
                  const writtenMidi = realMidi + 12;
                  const abcNote = midiToAbcByKey(writtenMidi, currentSong.key, measureAccRef, spell);
                  measureAbc += prefix + abcNote + abcDur + (tieOut ? "-" : "");
                  if (tiedTail) measureAbc += midiToAbcByKey(writtenMidi, currentSong.key, measureAccRef, spell) + "";

                  if (isTieTail) {
                    // タイの後ろ側の音：TABでは再度弾かない。歌詞（度数）行は位置合わせのため「*」でスキップ
                    lineWords += "* ";
                  } else {
                    const label = getDegreeLabelFromMidi(realMidi, activeChord);
                    lineWords += label + " ";
                    if (tiedTail) lineWords += "* ";

                    measureNotesData.push({
                      beatPos: measureBeat,
                      midi: realMidi,
                      isHarm: false,
                      chordMinMidi: MIN_BASS_MIDI,
                      chordMaxMidi: MAX_BASS_MIDI
                    });
                  }
                }

                measureBeat += durBeat;
                if (Math.abs(measureBeat - Math.round(measureBeat)) < 0.01) {
                  measureAbc += " ";
                }
              });
            } else {
              let pool = PHRASE_DICTIONARY.filter(cell => {
                // 16分音符の許可判定
                if (!allow16th && hasSixteenth(cell)) return false;
                // 16分許可時はMechanicalの8分版を除外（高速フレーズを優先）
                if (allow16th && cell.cat.includes("Mechanical") && cell.cat.includes("8th")) return false;

                // ハーモニクスは、そのコード上でコードトーンのナチュラル・ハーモニクスが十分に鳴らせる場合のみ許可
                if (cell.isHarm) {
                  const vh1 = getValidHarmonicsForChord(chord1).filter(h => h.priority >= 2 && h.midi <= 62);
                  const vh2 = getValidHarmonicsForChord(chord2).filter(h => h.priority >= 2 && h.midi <= 62);
                  const uniquePcs1 = new Set(vh1.map(h => h.pc));
                  const uniquePcs2 = new Set(vh2.map(h => h.pc));
                  if (uniquePcs1.size < 3 || uniquePcs2.size < 3) return false;
                }

                if (category !== "ALL") {
                  if (category === "TRIAD" && !cell.cat.includes("Triad") && !cell.cat.includes("Drop")) return false;
                  if (category === "BEBOP" && !cell.cat.includes("Parker") && !cell.cat.includes("Coltrane") && !cell.cat.includes("V7")) return false;
                  if (category === "PENTA" && !cell.cat.includes("Mechanical")) return false;
                }
                // Donna Lee由来フレーズは、元のコード種別（ii-Vは2コード）に合う小節にだけ使う
                if (cell.q) {
                  const q1 = chordQuality(chord1.name);
                  if (!cell.q.includes(q1)) return false;
                  if (cell.q2) return !!c2Str && cell.q2.includes(chordQuality(chord2.name));
                  return !c2Str || chordQuality(chord2.name) === q1;
                }
                if (chord1.isV7) return cell.onlyV7 || (!cell.onlyMajor && !cell.onlyMinor);
                if (chord1.isMajor) return !cell.onlyV7 && !cell.onlyMinor;
                if (chord1.isMinor) return !cell.onlyV7 && !cell.onlyMajor;
                return true;
              });

              if (pool.length === 0) {
                pool = PHRASE_DICTIONARY.filter(c => (!allow16th ? !hasSixteenth(c) : true) && !c.onlyV7 && !c.onlyMajor && !c.onlyMinor && !c.q);
              }
              if (pool.length === 0) {
                // 万が一条件が厳しすぎて見つからない場合の最終フォールバック
                pool = [PHRASE_DICTIONARY[0]];
              }

              // 前の小節の最後の音（prevLastMidi）から1オクターブ以内かつ近いポジションで繋がる（フレーズ, ルート音）の候補を探索
              const degrees1 = getChordDegrees(chord1);
              const degrees2 = getChordDegrees(chord2);
              let candidates = [];

              pool.forEach(candCell => {
                const offs = candCell.d.map(deg => (degrees1[deg] !== undefined ? degrees1[deg] : 0));
                const minOff = Math.min(...offs);
                const maxOff = Math.max(...offs);
                const firstOff = offs[0];
                const isMech = candCell.cat.includes("Mechanical");
                const isUp = candCell.cat.includes("Up");

                for (let oct = 1; oct <= 4; oct++) {
                  const r = chord1.rootPc + oct * 12;
                  const minMidi = r + minOff;
                  const maxMidi = r + maxOff;
                  const firstMidi = r + firstOff;

                  if (minMidi < SOLO_MIN_MIDI || maxMidi > MAX_BASS_MIDI) continue;

                  const refBox = prevLastFret !== null ? Math.max(1, Math.min(15, prevLastFret - 2)) : currentFretCenter;
                  let startFret = prevLastFret !== null ? prevLastFret : (currentFretCenter + 2);
                  if (isMech) {
                    if (candCell.cat.includes("Mechanical V7 Dim")) {
                      if (isUp) {
                        if (firstMidi < SOLO_MIN_MIDI || firstMidi > 42 || maxMidi > 60) continue;
                      } else {
                        if (firstMidi < 41 || firstMidi > 58 || minMidi < SOLO_MIN_MIDI) continue;
                      }
                    } else {
                      if (maxMidi > 58 || minMidi < SOLO_MIN_MIDI) continue;
                    }
                    startFret = Number(getTabForNote(firstMidi, false, refBox).fret) || startFret;
                  } else {
                    if (maxMidi > 58) continue;
                    startFret = Number(getTabForNote(firstMidi, !!candCell.isHarm, refBox).fret) || startFret;
                  }

                  const jump = prevLastMidi !== null ? Math.abs(firstMidi - prevLastMidi) : 0;
                  const fretDiff = Math.abs(startFret - (prevLastFret !== null ? prevLastFret : (currentFretCenter + 2)));
                  candidates.push({ cell: candCell, root1: r, jump, fretDiff, firstMidi });
                }
              });

              cell = pool[Math.floor(Math.random() * pool.length)];
              let actualRoot1 = chord1.roots[Math.floor(Math.random() * chord1.roots.length)];

              if (candidates.length > 0) {
                if (prevLastMidi !== null) {
                  // 小節を跨ぐ際、同音(jump === 0)を避け、半音上下(1)またはスケール上の隣の音(2:全音)を最優先にする
                  const stepCandidates = candidates.filter(c => c.jump >= 1 && c.jump <= 2);
                  const nearCandidates = candidates.filter(c => c.jump >= 1 && c.jump <= 4);
                  const withinOctave = candidates.filter(c => c.jump >= 1 && c.jump <= 12);
                  const targetList = stepCandidates.length > 0 ? stepCandidates : (nearCandidates.length > 0 ? nearCandidates : (withinOctave.length > 0 ? withinOctave : candidates));

                  targetList.forEach(c => {
                    let stepScore = 0;
                    if (c.jump === 0) {
                      stepScore = 50; // 同音反復に強いペナルティ
                    } else if (c.jump === 1 || c.jump === 2) {
                      stepScore = 0;  // 半音上下・スケール上の隣（全音）を最優先
                    } else if (c.jump === 3) {
                      stepScore = 3;  // 短3度（ペンタトニックの隣など）
                    } else {
                      stepScore = c.jump * 2.5;
                    }
                    c.score = stepScore + c.fretDiff * 1.1;
                  });
                  targetList.sort((a, b) => a.score - b.score);
                  const bestScore = targetList[0].score;
                  // 最もアプローチが自然でフレットも近い上位グループから選択
                  const topChoices = targetList.filter(c => c.score <= bestScore + 2.5);
                  const chosen = pickWeighted(topChoices);
                  cell = chosen.cell;
                  actualRoot1 = chosen.root1;
                } else {
                  // 1小節目はミドルポジション（4〜7フレット付近）から自然に開始
                  candidates.sort((a, b) => a.fretDiff - b.fretDiff);
                  const topChoices = candidates.slice(0, Math.min(6, candidates.length));
                  const chosen = pickWeighted(topChoices);
                  cell = chosen.cell;
                  actualRoot1 = chosen.root1;
                }
              }

              // 1小節内に2つ目のコードがある場合、前半の最後の音から同音を避けて半音・全音で繋がるオクターブを選択
              let actualRoot2 = actualRoot1;
              if (c2Str) {
                const midNoteIdx = Math.max(0, Math.floor(cell.d.length / 2) - 1);
                const midLastMidi = actualRoot1 + (degrees1[cell.d[midNoteIdx]] || 0);
                const secondHalfFirstOff = degrees2[cell.d[midNoteIdx + 1]] || 0;
                actualRoot2 = chord2.roots[0];
                let bestR2Score = 999;
                for (let oct = 1; oct <= 4; oct++) {
                  const r2 = chord2.rootPc + oct * 12;
                  const offs2 = cell.d.map(deg => (degrees2[deg] !== undefined ? degrees2[deg] : 0));
                  if (r2 + Math.min(...offs2) < SOLO_MIN_MIDI || r2 + Math.max(...offs2) > MAX_BASS_MIDI) continue;
                  const j2 = Math.abs((r2 + secondHalfFirstOff) - midLastMidi);
                  const r2Score = (j2 === 0) ? 50 : ((j2 <= 2) ? j2 : j2 * 2);
                  if (r2Score < bestR2Score) {
                    bestR2Score = r2Score;
                    actualRoot2 = r2;
                  }
                }
              }

              // 次の小節のコードのターゲット音（R, 3, 5, 7）を先読みし、現在の小節の最後の音が同音にならないようアプローチノート化する準備
              const nextChordRaw = chords[globalMeasureIdx + 1];
              const nextChord1 = nextChordRaw ? parseChord(nextChordRaw.split(/\s+/).filter(Boolean)[0]) : null;
              const totalNotesInCell = cell.p.filter(dt => !dt.startsWith("z")).length;

              let noteIdx = 0;
              let measureBeat = 0;
              let tripCounter = 0;

              cell.p.forEach((durType) => {
                const dur = resolveDuration(durType, tripCounter);
                const { durBeat, abcDur, isRest, prefix, tiedTail } = dur;
                tripCounter = dur.tripCounter;

                
                const activeChord = measureBeat < 2 ? chord1 : chord2;
                const activeRoot = measureBeat < 2 ? actualRoot1 : actualRoot2;
                const degrees = getChordDegrees(activeChord);

                if (isRest) {
                  measureAbc += prefix + abcDur;
                } else {
                  const degName = cell.d[noteIdx] || 'R';
                  const offset = degrees[degName] !== undefined ? degrees[degName] : 0;
                  let realMidi = activeRoot + offset;
                  let label = degName.startsWith('s') ? getDegreeLabelFromMidi(realMidi, activeChord) : formatDegreeLabel(degName, cell.isHarm);

                  // 小節の最後の音（かつメカニカルやハーモニクスでない通常フレーズ）で、次の小節のコードの主要音と同音になりそうな場合やアプローチ可能な場合、スケール上の隣または半音上下のアプローチノートに調整
                  const isMechPhrase = cell.cat.includes("Mechanical");
                  if (!cell.isHarm && !isMechPhrase && !cell.authentic && noteIdx === totalNotesInCell - 1 && nextChord1 && measureNotesData.length > 0) {
                    const prevNoteMidi = measureNotesData[measureNotesData.length - 1].midi;
                    const nextThird = nextChord1.isMinor || nextChord1.isDim ? 3 : 4;
                    const nextFifth = nextChord1.isDim ? 6 : 7;
                    const nextSeventh = nextChord1.isMajor ? 11 : 10;
                    const nextTargets = [0, nextThird, nextFifth, nextSeventh].map(iv => (nextChord1.rootPc + iv) % 12);

                    // 現在の最後の音が次のコードのターゲット音と完全に同じピッチクラスの場合、半音または全音のアプローチノートに動かして次小節頭での同音反復を防ぐ
                    if (nextTargets.includes(realMidi % 12)) {
                      const scaleIntervals = activeChord.isMinor
                        ? [0, 2, 3, 5, 7, 9, 10]
                        : (activeChord.isV7 ? [0, 2, 4, 5, 7, 9, 10] : [0, 2, 4, 5, 7, 9, 11]);
                      const scaleSet = new Set(scaleIntervals.map(iv => (activeChord.rootPc + iv) % 12));

                      // スケール上の隣の音（全音または半音）を優先し、なければクロマチック（半音上下）を選択
                      const stepOffsets = [2, -2, 1, -1];
                      for (let st of stepOffsets) {
                        const candMidi = realMidi + st;
                        if (candMidi >= SOLO_MIN_MIDI && candMidi <= MAX_BASS_MIDI && candMidi !== prevNoteMidi) {
                          if (scaleSet.has(candMidi % 12) || Math.abs(st) === 1) {
                            realMidi = candMidi;
                            const newIv = (realMidi - activeChord.rootPc + 120) % 12;
                            const ivNames = { 0:'R', 1:'b9', 2:'2', 3: activeChord.isMajor ? '#9' : 'm3', 4:'3', 5:'4', 6:'b5', 7:'5', 8:'b13', 9:'6', 10:'m7', 11:'M7' };
                            label = ivNames[newIv] || label;
                            break;
                          }
                        }
                      }
                    }
                  }

                  // ハーモニクス時は実際の倍音と五線譜・度数・TABが100%一致するようにナチュラル・ハーモニクス実音を選択
                  if (cell.isHarm) {
                    const validHarms = getValidHarmonicsForChord(activeChord);
                    if (validHarms.length > 0) {
                      const cleanTarget = degName.replace('_down', '').replace('_15', '').replace('_8', '').replace('R15', 'R').replace('R8', 'R').replace('38', '3').replace('58', '5').replace('78', '7');
                      const prevHarmMidi = measureNotesData.length > 0 ? measureNotesData[measureNotesData.length - 1].midi : 55;
                      let bestH = null;
                      let bestHScore = 9999;

                      validHarms.forEach(h => {
                        let s = Math.abs(h.midi - prevHarmMidi) * 0.7;
                        // 目標の度数と一致するハーモニクスがあれば優先
                        if (h.degLabel === cleanTarget || (cleanTarget === '3' && h.degLabel === 'm3') || (cleanTarget === '7' && (h.degLabel === 'm7' || h.degLabel === 'M7'))) {
                          s -= 8;
                        }
                        s -= h.priority * 2;
                        // 直前と全く同じ音が連続しすぎないよう微調整
                        if (measureNotesData.length > 0 && h.midi === prevHarmMidi) s += 6;
                        // 五線譜上で見やすい音域（12F/9F/7F/5F中心）を優遇
                        if (h.midi > 62) s += (h.midi - 62) * 1.5;

                        if (s < bestHScore) {
                          bestHScore = s;
                          bestH = h;
                        }
                      });

                      if (bestH) {
                        realMidi = bestH.midi;
                        label = `<${bestH.degLabel}>`;
                      }
                    }
                  }

                  // ベースは実音より1オクターブ高く記譜する移調楽器のため、+12して描画する
                  const writtenMidi = realMidi + 12;
                  const abcNote = midiToAbcByKey(writtenMidi, currentSong.key, measureAccRef);
                  measureAbc += prefix + abcNote + abcDur;
                  if (tiedTail) measureAbc += midiToAbcByKey(writtenMidi, currentSong.key, measureAccRef);

                  lineWords += label + " ";
                  if (tiedTail) lineWords += "* "; // タイの後ろ側の音は歌詞（度数）行でスキップして位置を合わせる

                  // TAB計算を後回しにしてバッファに保存
                  const chordOffsets = cell.d.map(deg => (degrees[deg] !== undefined ? degrees[deg] : 0));
                  measureNotesData.push({
                    beatPos: measureBeat,
                    midi: realMidi,
                    isHarm: !!cell.isHarm,
                    chordMinMidi: activeRoot + Math.min(...chordOffsets),
                    chordMaxMidi: activeRoot + Math.max(...chordOffsets)
                  });

                  noteIdx++;
                }

                measureBeat += durBeat;
                // ジャズの一般的な記譜に合わせ、1拍（または連符の区切り）ごとにスペースを入れて連桁（ビーム）を分割する
                if (Math.abs(measureBeat - Math.round(measureBeat)) < 0.01) {
                  measureAbc += " ";
                }
              });
            }

            if (measureNotesData.length > 0) {
              prevLastMidi = measureNotesData[measureNotesData.length - 1].midi;
            }

            // 最大6フレット圏内のボックスを基準にし、必要に応じて2つのボックス（前半b1・後半b2）を連結する最適化
            let isDimMechanical = cell.cat.includes("Mechanical V7 Dim");
            let isDimUp = cell.cat.includes("Up");

            const getForceStringForNote = (n, idx, dimBaseStr = 0) => {
              if (isDimMechanical) {
                if (isDimUp) {
                  // 上昇：最低音から2音ずつ太い弦から細い弦へ上がる
                  let stepFromBottom = Math.round((n.midi - n.chordMinMidi) / 3);
                  return Math.min(3, Math.max(0, dimBaseStr + Math.floor(stepFromBottom / 2)));
                } else {
                  // 下降：最高音から2音ずつ細い弦から太い弦へ逆行する
                  let stepFromTop = Math.round((n.chordMaxMidi - n.midi) / 3);
                  return Math.min(3, Math.max(0, dimBaseStr - Math.floor(stepFromTop / 2)));
                }
              }
              return -1;
            };

            let bestBox1 = currentFretCenter;
            let bestBox2 = currentFretCenter;
            let bestDimBaseStr = isDimUp ? 0 : 3;
            let bestMeasureScore = 999999;

            const splitIdx = Math.ceil(measureNotesData.length / 2);
            const dimBaseOptions = isDimMechanical
              ? (cell.p.length <= 8 ? (isDimUp ? [0, 1] : [3, 2]) : (isDimUp ? [0] : [3]))
              : [0];

            dimBaseOptions.forEach(dimBase => {
              for (let b1 = 1; b1 <= 15; b1++) {
                for (let b2 = 1; b2 <= 15; b2++) {
                  let score = 0;
                  let simPrevTab = prevLastFret !== null ? { stringIdx: 1, fretNum: prevLastFret } : null;

                  measureNotesData.forEach((n, idx) => {
                    const activeBox = idx < splitIdx ? b1 : b2;
                    const forceString = getForceStringForNote(n, idx, dimBase);
                    const tabRes = getTabForNote(n.midi, n.isHarm, activeBox, forceString, simPrevTab);
                    score += tabRes.score;

                    // コード境目（1音目）は直前の音のフレットから離れないよう誘導
                    if (idx === 0 && prevLastFret !== null && !n.isHarm && tabRes.fretNum !== null) {
                      score += Math.abs(tabRes.fretNum - prevLastFret) * 3.0;
                    }
                    simPrevTab = tabRes;
                  });

                  // 前小節のボックスからの移動コスト
                  score += Math.abs(b1 - currentFretCenter) * 2.0;

                  // 1つのボックスで無理なく収まるなら維持し、広い音域のときは2つ目のボックスへ滑らかに連結する
                  if (b1 !== b2) {
                    score += 4.0 + Math.abs(b2 - b1) * 1.5;
                  }

                  if (score < bestMeasureScore) {
                    bestMeasureScore = score;
                    bestBox1 = b1;
                    bestBox2 = b2;
                    bestDimBaseStr = dimBase;
                  }
                }
              }
            });
            currentFretCenter = bestBox2;

            // 決定した最適な2ボックス連結ポジション（bestBox1 -> bestBox2）を使ってTAB譜を生成
            let buildPrevTab = prevLastFret !== null ? { stringIdx: 1, fretNum: prevLastFret } : null;
            measureNotesData.forEach((n, idx) => {
              const activeBox = idx < splitIdx ? bestBox1 : bestBox2;
              const forceString = getForceStringForNote(n, idx, bestDimBaseStr);
              const chosenTab = getTabForNote(n.midi, n.isHarm, activeBox, forceString, buildPrevTab);
              buildPrevTab = chosenTab;
              measureTabNotes.push({
                beatPos: n.beatPos,
                tab: chosenTab,
                isHarm: n.isHarm
              });
            });

            if (measureTabNotes.length > 0) {
              const lastTab = measureTabNotes[measureTabNotes.length - 1].tab;
              const parsedFret = parseInt(String(lastTab.fret).replace(/[^0-9]/g, ''), 10);
              if (!isNaN(parsedFret)) {
                prevLastFret = parsedFret;
              }
            }

            lineAbc += measureAbc + " | ";
            tabMeasures.push({ chord: chordRaw, notes: measureTabNotes });
            
            let compAccRef = {};
            const v1 = getPianoVoicing(chord1, currentSong.key, compAccRef);
            const v2 = c2Str ? getPianoVoicing(chord2, currentSong.key, compAccRef) : v1;
            allComping += `${v1} ${v2} | `;
          });

          genSystems.push({
            abcStr: abcHeader + lineAbc + "\n" + lineWords,
            tabMeasures
          });

          allAudioMelody += lineAbc + "\n";
          allComping += "\n";
        }

        setSystemsData(genSystems);
        setRawAbcData({ melody: allAudioMelody, comping: allComping });
      };

      // テンポ(BPM)や伴奏音量が変更された時はフレーズを再生成せず、オーディオ用のテキストだけを更新する
      useEffect(() => {
        if (!rawAbcData.melody) return;
        const audioH = [
          "X: 1",
          "M: 4/4",
          "L: 1/8",
          `Q: 1/4=${bpm}`,
          `K: ${currentSong.key} clef=bass`,
          "%%staves (1 2)",
          "V: 1 clef=bass\n%%MIDI program 33\n%%MIDI transpose -12",
          "V: 2 clef=treble\n%%MIDI program 0"
        ].join("\n") + "\n";

        // 伴奏の基本強弱は !p!（音量は再生時に sequenceCallback で調整するので、ここでは固定）
        const v2Body = "[V: 2]\n!p! " + rawAbcData.comping;
        setFullAudioAbc(audioH + "[V: 1]\n" + rawAbcData.melody + v2Body);
      }, [rawAbcData, bpm, currentSong.key]);

      useEffect(() => {
        generateEtude();
      }, [category, allow16th, currentSong, chords]);

      // スコア描画
      useEffect(() => {
        systemsData.forEach((sys, idx) => {
          const elId = `abc-system-${idx}`;
          const el = document.getElementById(elId);
          if (el && sys.abcStr && window.ABCJS) {
            window.ABCJS.renderAbc(el, sys.abcStr, {
              add_classes: true,
              responsive: "resize",
              staffwidth: 1150,
              paddingbottom: 4,
              paddingtop: idx === 0 ? 12 : 4
            });
          }
        });
      }, [systemsData]);

      useEffect(() => { loopRef.current = loopOn; }, [loopOn]);

      const clearHighlights = () => {
        document.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));
      };

      // 再生中の音符を、表示用の楽譜側でハイライトする
      const highlightEvent = (ev) => {
        if (!ev || (ev.measureStart && ev.left === null)) return;
        clearHighlights();
        if (ev.elements && Array.isArray(ev.elements)) {
          const audioNotes = Array.from(document.querySelectorAll("#audio-hidden-paper .abcjs-v0 .abcjs-note, #audio-hidden-paper .abcjs-v0 .abcjs-rest"));
          const displayNotes = Array.from(document.querySelectorAll("#score-wrapper .abcjs-note, #score-wrapper .abcjs-rest"));
          ev.elements.forEach(element => {
            if (!element) return;
            let index = audioNotes.indexOf(element);
            if (index === -1 && element.closest) {
              const parent = element.closest('.abcjs-note, .abcjs-rest');
              if (parent) index = audioNotes.indexOf(parent);
            }
            if (index !== -1 && displayNotes[index]) displayNotes[index].classList.add("abcjs-highlight");
          });
        }
      };

      // ---- 独立ミキサー：abcjsが生成したベース／ピアノの音声バッファを、こちらで用意した別々のゲイン経由で再生する ----
      const stopSources = () => {
        const P = playerRef.current;
        (P.sources || []).forEach(s => { try { s.onended = null; s.stop(); } catch (e) {} try { s.disconnect(); } catch (e) {} });
        P.sources = [];
      };
      const getBufs = (synth) => {
        let b = null;
        try { if (typeof synth.getAudioBuffer === "function") b = synth.getAudioBuffer(); } catch (e) {}
        if (!b && synth.audioBuffers) b = synth.audioBuffers;
        const arr = Array.isArray(b) ? b : (b ? [b] : []);
        return arr.filter(x => x && typeof x.duration === "number" && x.length > 0);
      };
      const customElapsed = () => {
        const P = playerRef.current;
        return P.cPlaying ? P.cOffset + (P.ctx.currentTime - P.cT0) : P.cOffset;
      };
      const customPlayFrom = (offsetSec) => {
        const P = playerRef.current;
        stopSources();
        const mk = (buf, gain) => {
          const s = P.ctx.createBufferSource();
          s.buffer = buf;
          s.connect(gain);
          s.start(0, Math.max(0, Math.min(offsetSec, buf.duration - 0.01)));
          return s;
        };
        P.sources = [mk(P.bassBuf, P.bassGain), mk(P.pianoBuf, P.pianoGain)];
        P.cOffset = offsetSec; P.cT0 = P.ctx.currentTime; P.cPlaying = true;
      };

      const teardownPlayer = () => {
        const P = playerRef.current;
        try { if (P.timing) P.timing.stop(); } catch (e) {}
        try { if (P.bass) P.bass.stop(); } catch (e) {}
        try { if (P.piano) P.piano.stop(); } catch (e) {}
        stopSources();
        P.bass = null; P.piano = null; P.timing = null; P.started = false; P.primed = false;
        P.custom = false; P.bassBuf = null; P.pianoBuf = null; P.cOffset = 0; P.cPlaying = false;
        clearHighlights();
      };

      const startPlayback = async () => {
        const P = playerRef.current;
        if (!P.bass || !P.piano || !P.timing || isPrimingRef.current) return;
        const token = P.token;
        try {
          // ブラウザの仕様でAudioContextはユーザー操作の中で resume しないと動かない（最初に必ず呼ぶ）
          if (P.ctx && P.ctx.state !== "running") await P.ctx.resume();
          if (!P.primed) {
            // 音声の生成(prime)は再生ボタンを押してから行う（起動時に行うと、操作前のAudioContextが止まっているため永久に待たされる）
            isPrimingRef.current = true;
            setIsPriming(true);
            try {
              await P.bass.prime();
              await P.piano.prime();
            } finally {
              isPrimingRef.current = false;
              setIsPriming(false);
            }
            if (token !== P.token) return; // 準備中に曲が変わった
            P.primed = true;
            // 生成済みの音声バッファが取れれば、ベース／ピアノを別ゲインで直接再生する（音量が完全に独立）
            P.custom = false;
            if (P.live) {
              const bb = getBufs(P.bass), pb = getBufs(P.piano);
              if (bb.length === 1 && pb.length === 1) { P.bassBuf = bb[0]; P.pianoBuf = pb[0]; P.custom = true; }
            }
            setMixInfo(P.custom ? "独立ミキサー" : "標準ミキサー");
          }
          if (P.custom) {
            const startAt = P.cOffset || 0;
            if (!P.started && startAt > 0 && P.timing.setProgress) P.timing.setProgress(startAt / P.bassBuf.duration);
            customPlayFrom(startAt);
            P.timing.start();
            P.started = true;
          } else if (!P.started) {
            P.bass.start(); P.piano.start(); P.timing.start();
            P.started = true;
          } else {
            P.bass.resume(); P.piano.resume(); P.timing.start();
          }
          setIsPlaying(true);
        } catch (e) {
          console.error("再生の開始に失敗:", e);
          setPlayerError(String((e && e.message) || e));
        }
      };

      const pausePlayback = () => {
        const P = playerRef.current;
        try {
          if (P.custom) {
            P.cOffset = customElapsed(); P.cPlaying = false; stopSources();
          } else {
            if (P.bass) P.bass.pause(); if (P.piano) P.piano.pause();
          }
          if (P.timing) P.timing.pause();
        } catch (e) { console.warn(e); }
        setIsPlaying(false);
      };

      const seekPlayback = (pct) => {
        const P = playerRef.current;
        if (!P.bass || !P.piano || !P.timing || !P.primed) return;
        try {
          if (P.custom) {
            P.cOffset = pct * P.bassBuf.duration;
            if (P.cPlaying) customPlayFrom(P.cOffset);
          } else {
            P.bass.seek(pct); P.piano.seek(pct);
          }
          P.timing.setProgress(pct);
        } catch (e) { console.warn(e); }
        setPlayProgress(pct);
      };

      const restartPlayback = () => {
        seekPlayback(0);
        clearHighlights();
        if (!isPlaying) startPlayback();
      };

      // 再生が最後まで進んだ時（ループONなら頭から再生し直す）
      const finishPlayback = () => {
        const P = playerRef.current;
        try { stopSources(); P.cOffset = 0; P.cPlaying = false; if (P.bass) P.bass.stop(); if (P.piano) P.piano.stop(); if (P.timing) P.timing.stop(); } catch (e) {}
        P.started = false;
        clearHighlights();
        setIsPlaying(false);
        setPlayProgress(0);
        if (loopRef.current) startPlayback();
      };

      // 曲・フレーズ・テンポが変わるたびに、再生用のベース／ピアノ2系統のシンセを作り直す（音量変更では作り直さない）
      useEffect(() => {
        if (!window.ABCJS || !fullAudioAbc) return;
        if (!window.ABCJS.synth.supportsAudio()) { setPlayerError("このブラウザは音声再生に対応していません"); return; }
        const P = playerRef.current;
        const token = ++P.token;
        teardownPlayer();
        setPlayerReady(false);
        setPlayerError("");
        setIsPlaying(false);
        setPlayProgress(0);

        const visualObj = window.ABCJS.renderAbc("audio-hidden-paper", fullAudioAbc, { add_classes: true })[0];

        // ベース用／ピアノ用に、それぞれ自分のパートだけを含むABCを作る（音量はそれぞれ独立）
        let bassVisual = visualObj, pianoVisual = visualObj, separated = false;
        try {
          const iV1 = fullAudioAbc.indexOf("[V: 1]\n");
          const iV2 = fullAudioAbc.indexOf("[V: 2]\n");
          if (iV1 > 0 && iV2 > iV1) {
            const head = fullAudioAbc.slice(0, iV1).replace("%%staves (1 2)\n", "");
            const melody = fullAudioAbc.slice(iV1, iV2);
            const comping = fullAudioAbc.slice(iV2);
            const bassHead = head.replace("V: 2 clef=treble\n%%MIDI program 0\n", "");
            const pianoHead = head.replace("V: 1 clef=bass\n%%MIDI program 33\n%%MIDI transpose -12\n", "");
            const bv = window.ABCJS.renderAbc("*", bassHead + melody)[0];
            const pv = window.ABCJS.renderAbc("*", pianoHead + comping)[0];
            if (bv && pv) { bassVisual = bv; pianoVisual = pv; separated = true; }
          }
        } catch (e) { console.warn("パート分離に失敗。従来方式で再生します:", e); }

        if (!P.ctx) {
          P.ctx = new (window.AudioContext || window.webkitAudioContext)();
          P.bassGain = P.ctx.createGain();
          P.pianoGain = P.ctx.createGain();
          P.bassGain.connect(P.ctx.destination);
          P.pianoGain.connect(P.ctx.destination);
        }
        // シンセの出力先(destination)だけを各ゲインに差し替えたAudioContextを渡す
        const ctxFor = (gainNode) => new Proxy(P.ctx, {
          get(target, prop) {
            if (prop === "destination") return gainNode;
            const v = target[prop];
            return typeof v === "function" ? v.bind(target) : v;
          }
        });
        const withTimeout = (promise, ms, label) => Promise.race([
          promise,
          new Promise((_, rej) => setTimeout(() => rej(new Error(label + "がタイムアウトしました")), ms))
        ]);

        // ABCJSは「%%MIDI control 7」を解釈しないため、使わないトラックの音量をsequenceCallbackで0にして系統を分ける
        //   トラック0 = ベース、トラック1 = ピアノ伴奏
        //   live=true : 各系統を別ゲインに接続し、音量はゲインでリアルタイムに変更
        //   live=false: （フォールバック）通常の出力に接続し、音量はsequenceCallbackで反映（変更時は作り直し）
        const makeSynth = async (live, keepTrack) => {
          const gainNode = keepTrack === 0 ? P.bassGain : P.pianoGain;
          const scale = live ? 1 : (keepTrack === 0 ? (volRef.current.backingOnly ? 0 : 1) : volRef.current.vol / 70);
          const synth = new window.ABCJS.synth.CreateSynth();
          const sequenceCallback = (tracks) => {
            if (!Array.isArray(tracks)) return tracks;
            tracks.forEach((track, ti) => {
              if (!Array.isArray(track)) return;
              // 使わない系統（または音量0の系統）は、音量0ではなく「音そのものを取り除く」
              // （音量0が既定値扱いになり、他系統の音が混ざって聞こえるのを防ぐ）
              const mute = (!separated && ti !== keepTrack) || scale === 0;
              if (mute) {
                const rest = track.filter(ev => !(ev && typeof ev.pitch === "number"));
                track.splice(0, track.length, ...rest);
                return;
              }
              track.forEach(ev => {
                if (!ev || typeof ev.volume !== "number") return;
                ev.volume = Math.max(1, Math.min(127, Math.round(ev.volume * scale)));
              });
            });
            return tracks;
          };
          const opts = { chordsOff: true, sequenceCallback };
          await withTimeout(synth.init({
            audioContext: live ? ctxFor(gainNode) : P.ctx,
            visualObj: separated ? (keepTrack === 0 ? bassVisual : pianoVisual) : visualObj,
            millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
            options: opts,
            ...opts
          }), 60000, keepTrack === 0 ? "ベース音源の読み込み" : "ピアノ音源の読み込み");
          return synth; // prime（音声の生成）は、再生ボタンを押した時に行う
        };
        // 2系統は順番に読み込む（同時読み込みで音源キャッシュが競合するのを避ける）
        const buildBoth = async (live) => {
          const bass = await makeSynth(live, 0);
          const piano = await makeSynth(live, 1);
          return { bass, piano };
        };

        (async () => {
          let res;
          P.live = true;
          try {
            res = await buildBoth(true);
          } catch (e) {
            console.warn("リアルタイム音量モードで失敗。通常モードで再試行します:", e);
            if (token !== P.token) return;
            P.live = false;
            res = await buildBoth(false);
          }
          if (token !== P.token) return; // より新しい作り直しが始まっていたら破棄
          P.bass = res.bass;
          P.piano = res.piano;
          P.totalMs = visualObj.millisecondsPerMeasure() * measureCount;
          P.timing = new window.ABCJS.TimingCallbacks(visualObj, {
            eventCallback: (ev) => {
              if (token !== P.token) return "continue";
              if (!ev) { finishPlayback(); return; }
              if (typeof ev.milliseconds === "number" && P.totalMs > 0) {
                setPlayProgress(Math.min(1, ev.milliseconds / P.totalMs));
              }
              highlightEvent(ev);
              return "continue";
            }
          });
          if (P.live) {
            P.pianoGain.gain.value = volRef.current.vol / 70;
            P.bassGain.gain.value = volRef.current.backingOnly ? 0 : 1;
          } else {
            P.pianoGain.gain.value = 1;
            P.bassGain.gain.value = 1;
          }
          setPlayerReady(true);
        })().catch((e) => {
          console.error("音声の準備に失敗:", e);
          if (token === P.token) setPlayerError(String((e && e.message) || e));
        });
      }, [fullAudioAbc, rebuildKey]);

      // 伴奏音量・「ピアノ伴奏のみ再生」は再生中でもリアルタイムに反映（70%が従来の音量）
      useEffect(() => {
        volRef.current = { vol: backingVol, backingOnly: isBackingOnly };
        const P = playerRef.current;
        if (!P.ctx || !P.pianoGain || !P.bassGain) return;
        if (!P.live) {
          // ライブ音量が使えない環境のみ：操作が止まってから音声を作り直して反映
          const timer = setTimeout(() => setRebuildKey(k => k + 1), 400);
          return () => clearTimeout(timer);
        }
        const now = P.ctx.currentTime;
        P.pianoGain.gain.setTargetAtTime(backingVol / 70, now, 0.02);
        P.bassGain.gain.setTargetAtTime(isBackingOnly ? 0 : 1, now, 0.02);
      }, [backingVol, isBackingOnly]);

      return (
        <div className="flex flex-col flex-1 bg-white rounded-2xl shadow-sm p-4 md:p-6 border border-slate-200">
          
          {/* Header Controls */}
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-5 mb-5 border-b border-slate-200">
            <div>
              <div className="flex items-center gap-3">
                <h1 className="text-xl md:text-2xl font-black text-amber-600 tracking-tight">
                  Bass Solo Trainer
                </h1>
              </div>
            </div>

            {/* カテゴリ切り替え & 再生成 */}
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setIsModalOpen(true)}
                className="px-3 py-1.5 bg-white hover:bg-slate-50 text-amber-600 font-bold text-xs rounded-xl transition border border-slate-200 shadow-sm"
              >
                ♪ プリセット曲から選択
              </button>

              <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm transition hover:bg-slate-50">
                <input
                  type="checkbox"
                  checked={allow16th}
                  onChange={(e) => setAllow16th(e.target.checked)}
                  className="w-3.5 h-3.5 text-amber-500 rounded border-slate-300 focus:ring-0 cursor-pointer"
                />
                <span>16分音符を使用</span>
              </label>

              <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                {[
                  { id: "ALL", label: "All Mix" },
                  { id: "TRIAD", label: "Triad" },
                  { id: "BEBOP", label: "Jazz Phrase" },
                  { id: "PENTA", label: "Mechanical" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCategory(tab.id)}
                    className={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${
                      category === tab.id
                        ? "bg-white text-amber-600 shadow-sm"
                        : "text-slate-500 hover:text-slate-700"
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <button
                onClick={generateEtude}
                className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs md:text-sm rounded-xl transition flex items-center gap-1.5 shadow-sm"
              >
                <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                エチュード再生成
              </button>
            </div>
          </div>

          {/* コード進行編集 */}
          <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4">
            <div className="flex justify-between items-center mb-3">
              <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                コード進行 ({measureCount} 小節)
              </span>
              <span className="text-[10px] text-slate-400">※「Dm7 G7」のようにスペース区切りで2拍ずつのチェンジ</span>
            </div>
            <div className="grid grid-cols-4 sm:grid-cols-8 gap-2 max-h-40 overflow-y-auto pr-1">
              {Array.from({ length: measureCount }).map((_, i) => (
                <div key={i} className="flex flex-col">
                  <span className="text-[9px] text-slate-400 font-mono pl-1">{i + 1}</span>
                  <input
                    type="text"
                    value={chords[i] || ""}
                    onChange={(e) => {
                      const newC = [...chords];
                      newC[i] = e.target.value;
                      setChords(newC);
                    }}
                    className="bg-white border border-slate-200 text-slate-800 px-2 py-1.5 rounded text-xs font-bold focus:ring-1 focus:ring-amber-500 focus:outline-none"
                  />
                </div>
              ))}
            </div>
          </div>

          {/* 伴奏プレイヤーバー（添付ファイル arpeggio solo etude.html のプレイヤーUIを統合） */}
          <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 mb-4 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-4">
              <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
                <input
                  type="checkbox"
                  checked={isBackingOnly}
                  onChange={(e) => setIsBackingOnly(e.target.checked)}
                  className="w-4 h-4 text-amber-500 rounded border-slate-300 focus:ring-0 cursor-pointer"
                />
                <span>ピアノ伴奏のみ再生</span>
              </label>

              <div className="flex items-center gap-2 text-xs text-slate-600">
                <span>テンポ: {bpm} BPM</span>
                <input
                  type="range" min="70" max="300" step="5" value={bpm}
                  onChange={(e) => {
                    setBpm(Number(e.target.value));
                  }}
                  className="w-24 accent-amber-500 h-1.5 bg-slate-200 rounded-lg cursor-pointer"
                />
              </div>

              <div className="flex items-center gap-2 text-xs text-slate-600">
                <span>伴奏音量: {backingVol}%</span>
                <input
                  type="range" min="0" max="100" step="5" value={backingVol}
                  onChange={(e) => {
                    setBackingVol(Number(e.target.value));
                  }}
                  className="w-20 accent-amber-500 h-1.5 bg-slate-200 rounded-lg cursor-pointer"
                />
              </div>
            </div>

            {/* 再生コントロール（Play / Pause、頭出し、ループ、シークバー） */}
            <div className="flex items-center gap-2">
              <button
                onClick={() => (isPlaying ? pausePlayback() : startPlayback())}
                disabled={!playerReady || isPriming}
                title={playerReady ? (isPlaying ? "一時停止" : "再生") : "音声を準備中…"}
                className={`w-9 h-9 flex items-center justify-center rounded-full border text-sm font-bold transition shadow-sm ${
                  playerReady
                    ? "bg-amber-500 border-amber-500 text-white hover:bg-amber-600 cursor-pointer"
                    : "bg-slate-100 border-slate-200 text-slate-400 cursor-wait"
                }`}
              >
                {isPriming ? "…" : (isPlaying ? "❚❚" : "▶")}
              </button>
              <button
                onClick={restartPlayback}
                disabled={!playerReady}
                title="頭から"
                className="w-9 h-9 flex items-center justify-center rounded-full border border-slate-200 bg-white text-slate-600 text-sm hover:bg-slate-100 transition shadow-sm disabled:opacity-40"
              >
                ⏮
              </button>
              <label className="flex items-center gap-1 cursor-pointer text-xs font-bold text-slate-700">
                <input
                  type="checkbox"
                  checked={loopOn}
                  onChange={(e) => setLoopOn(e.target.checked)}
                  className="w-3.5 h-3.5 text-amber-500 rounded border-slate-300 focus:ring-0 cursor-pointer"
                />
                <span>ループ</span>
              </label>
              {mixInfo && playerReady && !playerError && !isPriming && (
                <span className="text-[10px] text-slate-400">{mixInfo}</span>
              )}
              {(!playerReady || isPriming || playerError) && (
                <span className={`text-xs font-bold ${playerError ? "text-red-600" : "text-slate-500"}`}>
                  {playerError ? `音声エラー: ${playerError}` : (isPriming ? "音声を生成中…" : "音源を読み込み中…")}
                </span>
              )}
              <input
                type="range" min="0" max="1000" step="1"
                value={Math.round(playProgress * 1000)}
                disabled={!playerReady}
                onChange={(e) => seekPlayback(Number(e.target.value) / 1000)}
                className="w-32 md:w-48 accent-amber-500 h-1.5 bg-slate-200 rounded-lg cursor-pointer"
              />
            </div>
          </div>

          {/* 楽譜描画エリア（真っ白な紙の上に濃い黒・濃紺でくっきり描画） */}
          <div id="score-wrapper" className="flex-1 w-full bg-white text-slate-900 rounded-xl p-4 md:p-6 overflow-y-auto">
            {systemsData.map((sys, idx) => (
              <div key={idx} className="mb-2 last:mb-0">
                <div id={`abc-system-${idx}`} className="w-full"></div>
                <FourStringBassTab measures={sys.tabMeasures} />
              </div>
            ))}
            <div id="audio-hidden-paper" style={{ position: 'absolute', top: '-9999px', visibility: 'hidden' }}></div>
          </div>

          {/* プリセット選択モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[80vh] overflow-hidden flex flex-col border border-slate-200">
                <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h2 className="font-bold text-slate-800 text-sm">プリセット曲を選択</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="p-3 overflow-y-auto space-y-1.5">
                  {STANDARD_SONGS.map((song, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        setCurrentSong(song);
                        setMeasureCount(song.measures);
                        setChords([...song.chords]);
                        setIsModalOpen(false);
                      }}
                      className="w-full text-left px-4 py-3 rounded-xl hover:bg-amber-50 transition flex justify-between items-center group text-xs font-bold text-slate-700"
                    >
                      <div className="flex items-center gap-2">
                        <span>{song.title}</span>
                        <span className="text-[10px] text-amber-600 font-mono">({song.key})</span>
                      </div>
                      <span className="text-[10px] px-2 py-1 bg-slate-100 text-slate-500 rounded-md">
                        {song.measures} 小節
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
