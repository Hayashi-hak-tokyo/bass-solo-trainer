    const getValidHarmonicsForChord = (chord) => {
      const valid = [];
      NATURAL_HARMONICS.forEach(h => {
        const interval = (h.pc - chord.rootPc + 12) % 12;
        let degLabel = null;
        let priority = 0;

        if (interval === 0) { degLabel = 'R'; priority = 3; }
        else if (interval === 2) { degLabel = '9'; priority = 2; }
        else if (interval === 3 && (chord.isMinor || chord.isDim)) { degLabel = 'm3'; priority = 3; }
        else if (interval === 4 && (chord.isMajor || chord.isV7)) { degLabel = '3'; priority = 3; }
        else if (interval === 5 && (chord.isMinor || chord.isDim)) { degLabel = '11'; priority = 2; }
        else if (interval === 6 && chord.isDim) { degLabel = 'b5'; priority = 3; }
        else if (interval === 6 && (chord.isMajor || chord.isV7)) { degLabel = '#11'; priority = 1; }
        else if (interval === 7 && !chord.isDim) { degLabel = '5'; priority = 3; }
        else if (interval === 9 && (chord.isMajor || chord.isMinor || chord.isV7)) { degLabel = '6'; priority = 2; }
        else if (interval === 10 && !chord.isMajor) { degLabel = 'm7'; priority = 3; }
        else if (interval === 11 && chord.isMajor) { degLabel = 'M7'; priority = 3; }

        if (degLabel) {
          valid.push({ ...h, degLabel, priority });
        }
      });
      return valid;
    };

      { cat: "Coltrane Short V7", p: ["8","8","8","8", "8","8","8","8"], d: ['4', '3', '2', 'R', 'm7_down', '5_down', '3_down', '4_down'], onlyV7: true },
      { cat: "Coltrane 16th Run", p: ["16","16","16","16", "16","16","16","16", "8","8", "8","8"], d: ['R', '2', '3', '5', '3', '2', 'R', '6_down', '5_down', '3_down', 'R', '5_down'], onlyMajor: true },

      // 8. 実用ハーモニクス (音を伸ばしつつも拍数は正確に4拍に保つ)
      { cat: "Jaco Harmonics",    p: ["4", "4", "8","8", "8","8"], d: ['R', '5', '7', '38', '5', 'R'], isHarm: true },

      // 9. チャーリー・パーカー「Donna Lee」実譜面から抽出したビバップ・フレーズ
      ...DONNA_LEE_PHRASES,
      // 10. コルトレーン「Giant Steps」実譜面から抽出したフレーズ
      ...GIANT_STEPS_PHRASES,
      // 11. バッハ「半音階的幻想曲」（ジャコ版）から組み替えたマイナー用フレーズ
      ...CHROMATIC_FANTASY_PHRASES,
      ...CHROMATIC_FANTASY_IIV_PHRASES,

      // 12. バッハ「平均律 プレリュード BWV846」のアルペジオ
      ...PRELUDE_PHRASES,

      ...CHRISTIAN_PHRASES,

    // 16分系（16分・3連16分）を含むフレーズか
    // ジャズの実フレーズ（Parker・Coltrane・Christian）から取ったリズム。音の数ごとにまとめる
    // トライアドのフレーズに当てはめて、8分が並ぶだけの平坦なリズムを崩す
    const JAZZ_RHYTHMS = (() => {
      const BT = { "16": .25, "8": .5, "4": 1, "4.": 1.5, "2": 2, "2.": 3, "trip8": 1 / 3, "trip16": 1 / 6, z16: .25, z8: .5, z4: 1, z2: 2 };
      const byN = {}, seen = new Set(), halves = { front: [], back: [] };
      PHRASE_DICTIONARY.forEach(c => {
        if (!c.authentic || c.span2 || !/Parker|Coltrane|Christian/.test(c.cat)) return;
        if (c.p.some(t => BT[t] === undefined)) return;
        const rest = c.p.filter(t => t.startsWith("z")).reduce((a, t) => a + BT[t], 0);
        if (rest > 1.01) return;                                   // 休みが長すぎるものは使わない
        const n = c.p.filter(t => !t.startsWith("z")).length;
        if (c.p.every(t => t === "8")) return;                     // 8分が並ぶだけのものは意味がない
        const key = c.p.join(","); if (seen.has(key)) return; seen.add(key);
        (byN[n] = byN[n] || []).push({ p: c.p, from: c.cat });
        // 2拍ずつの「リズムの型」にも分けておく（前半＋後半を組み合わせて、音の数に合うリズムを増やす）
        let t = 0, cut = -1;
        c.p.forEach((tk, i) => { t += BT[tk]; if (Math.abs(t - 2) < 1e-6) cut = i + 1; });
        if (cut > 0) { halves.front.push({ p: c.p.slice(0, cut), from: c.cat }); halves.back.push({ p: c.p.slice(cut), from: c.cat }); }
      });
      const hk = new Set();
      ["front", "back"].forEach(k => { halves[k] = halves[k].filter(h => { const key = k + h.p.join(","); if (hk.has(key)) return false; hk.add(key); return true; }); });
      const plain = (h) => h.p.every(t => t === "8");
      halves.front.forEach(f => halves.back.forEach(bk => {
        if (plain(f) && plain(bk)) return;
        const pp = [...f.p, ...bk.p], key = pp.join(",");
        if (seen.has(key)) return; seen.add(key);
        const rest = pp.filter(t => t.startsWith("z")).reduce((a, t) => a + BT[t], 0);
        if (rest > 1.01 || pp[pp.length - 1].startsWith("z") && rest > 0.51) return;
        const n = pp.filter(t => !t.startsWith("z")).length;
        (byN[n] = byN[n] || []).push({ p: pp, from: f.from === bk.from ? f.from : f.from + " / " + bk.from });
      }));
      byN.halves = halves;     // 2拍ぶんのリズムの型（コードメロディのフィルでも使う）
      return byN;
    })();
    const TRIAD_RHYTHM_PROB = 0.85;   // トライアドのフレーズにジャズのリズムを当てる割合

    // ── Barry Harris モード（ギター版トレーナーから移植）：バリー・ハリスの6thディミニッシュ・スケール ──
    // 8音スケール＝「6th（または7th）コード」＋「ディミニッシュ7th」。コードトーンから8分で動くと、表拍にコードトーンが来る
    const MAJ6_DIM = [0, 2, 4, 5, 7, 8, 9, 11];   // 例 C: C D E F G Ab A B（C6 + Bdim7）
    const MIN6_DIM = [0, 2, 3, 5, 7, 8, 9, 11];   // 例 C: C D Eb F G Ab A B（Cm6 + Bdim7）
    const DOM7_DIM = [0, 2, 4, 5, 7, 8, 10, 11];  // 例 C: C D E F G Ab Bb B（C7 + Bdim7）
    const bhScaleFor = (chord) => {
      const t = String(chord.name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      const sh = (arr, k) => arr.map(x => (x + k + 12) % 12);
      if (chord.isDim && !t.includes("m7b5") && !t.includes("ø"))      // dim7：半音上のマイナー6thディミニッシュ（C#dim7 → Dm6）。拍頭はdimの音
        return { pcs: sh(MIN6_DIM, 1), cts: [0, 3, 6, 9], name: "minor 6th dim（半音上）", shift: 1, kind: "m6 dim" };
      if (t.includes("m7b5") || t.includes("ø"))                         // m7b5：短3度上のマイナー6th（Dm7b5 → Fm6）
        return { pcs: sh(MIN6_DIM, 3), cts: [0, 3, 6, 10], name: "minor 6th dim（短3度上）", shift: 3, kind: "m6 dim" };
      if (chord.isMinor && (t.includes("6") || /mM|m\(maj|mmaj/i.test(t)))
        return { pcs: MIN6_DIM, cts: [0, 3, 7, 9], name: "minor 6th dim", shift: 0, kind: "m6 dim" };
      if (chord.isMinor)                                                 // m7：短3度上のメジャー6th（Dm7 → F6）
        return { pcs: sh(MAJ6_DIM, 3), cts: [0, 3, 7, 10], name: "6th dim（短3度上＝相対の6th）", shift: 3, kind: "6 dim" };
      if (chord.isV7) return { pcs: DOM7_DIM, cts: [0, 4, 7, 10], name: "7th dim", shift: 0, kind: "7 dim" };
      return { pcs: MAJ6_DIM, cts: [0, 4, 7, 9], name: "6th dim", shift: 0, kind: "6 dim" };
    };
    const bhLadder = (pcs) => { const out = []; for (let n = -24; n <= 36; n++) if (pcs.includes(((n % 12) + 12) % 12)) out.push(n); return out; };
    const bhWalk = (ladder, start, steps) => { const i = ladder.indexOf(start); return ladder[i + steps]; };
    const bhNextCT = (cts, v, dir) => { for (let k = 1; k <= 24; k++) { const c = v + dir * k; if (cts.includes(((c % 12) + 12) % 12)) return c; } return v; };
    // 4音（半小節）または8音（1小節）のライン。dir=-1 下降, +1 上昇
    const bhPatterns = (sc, ct, len) => {
      const L = bhLadder(sc.pcs), out = [];
      const run = (st, n, dir) => Array.from({ length: n }, (_, k) => bhWalk(L, st, dir * k));
      if (len === 4) {
        out.push({ k: "down", o: run(ct, 4, -1) });
        out.push({ k: "up", o: run(ct, 4, 1) });
        const c2 = bhNextCT(sc.cts, ct, 1), c3 = bhNextCT(sc.cts, c2, 1);
        out.push({ k: "arp-down", o: [ct, c2, c3, bhWalk(L, c3, -1)] });
        return out;
      }
      out.push({ k: "down8", o: run(ct, 8, -1) });
      out.push({ k: "up8", o: run(ct, 8, 1) });
      // アルペジオで上がって、スケールで下りる（バリー・ハリスの基本形）
      const a2 = bhNextCT(sc.cts, ct, 1), a3 = bhNextCT(sc.cts, a2, 1);
      out.push({ k: "arp-up/scale-down", o: [ct, a2, ...run(a3, 6, -1)] });
      // スケールで下りて、アルペジオで上がる
      const d5 = run(ct, 5, -1), last = d5[4];
      const u1 = bhNextCT(sc.cts, last, 1), u2 = bhNextCT(sc.cts, u1, 1), u3 = bhNextCT(sc.cts, u2, 1);
      out.push({ k: "scale-down/arp-up", o: [...d5, u1, u2, u3] });
      // 裏拍から入る：dimの音から始めて下降（表拍にコードトーン）
      out.push({ k: "pickup", rest: true, o: run(bhWalk(L, ct, 1), 7, -1) });
      return out;
    };
    const PC_NAMES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
    const bhHint = (chord, sc) => PC_NAMES[(chord.rootPc + sc.shift) % 12] + sc.kind.replace(/^m6/, "m6").replace(/^6/, "6").replace(/^7/, "7");
    // 8分×8のスロットに「休符・伸ばし」を入れるリズム型。n=音 h=前の音を伸ばす r=休符
    // 表拍（偶数スロット）の音は消すか伸ばすだけなので、「表拍にコードトーン」のルールは崩れない
    const REST_MASKS = [
      "nnnnnnhr", "nnnnnhrr", "nhnnnnnh", "rrnnnnnn", "nnrnnnnn", "nnnnrnnn",
      "nhrnnnnn", "nnnhrnnn", "nnnnnhnh", "rnnnnnhr", "nnnnnnrr", "nhnhnnnn"
    ];
    const applyMask = (offs, mask) => {
      const p = [], d = [];
      const DUR = { 1: "8", 2: "4", 3: "4.", 4: "2", 5: "2.5", 6: "2." };
      const REST = { 1: ["z8"], 2: ["z4"], 3: ["z4", "z8"], 4: ["z2"] };
      for (let i = 0; i < 8; ) {
        if (mask[i] === "r") { let j = i; while (j < 8 && mask[j] === "r") j++; p.push(...REST[j - i]); i = j; continue; }
        let j = i + 1; while (j < 8 && mask[j] === "h") j++;
        p.push(DUR[j - i]); d.push("s" + offs[i]); i = j;
      }
      return { p, d };
    };

    const makeBarryHarrisCells = (chord1, chord2, twoChords, useRests = true) => {
      const sc1 = bhScaleFor(chord1);
      const cells = [];
      const startCTs = [...sc1.cts, ...sc1.cts.map(c => c + 12)];
      const hint1 = bhHint(chord1, sc1);
      if (!twoChords) {
        startCTs.forEach(ct => bhPatterns(sc1, ct, 8).forEach(pt => {
          if (pt.o.some(v => v === undefined)) return;
          const p = pt.rest ? ["z8", "8", "8", "8", "8", "8", "8", "8"] : ["8", "8", "8", "8", "8", "8", "8", "8"];
          cells.push({ cat: `BarryHarris ${sc1.name} ${pt.k}`, p, d: pt.o.map(v => "s" + v), authentic: true, bh: true, hint: hint1 });
          if (pt.rest) return;
          // 休符・伸ばしを入れた形（ランダムに3つ）
          if (useRests) {
            [...REST_MASKS].sort(() => Math.random() - 0.5).slice(0, 2).forEach(mask => {
              const r = applyMask(pt.o, mask);
              cells.push({ cat: `BarryHarris ${sc1.name} ${pt.k} ${mask}`, p: r.p, d: r.d, authentic: true, bh: true, hint: hint1 });
            });
          }
        }));
        return cells;
      }
      // 1小節2コード：前半は chord1 のスケール、後半は chord2 のスケールで、同じ向きに続ける
      const sc2 = bhScaleFor(chord2);
      const diff = ((chord1.rootPc - chord2.rootPc) + 12) % 12;   // root1基準のオフセット → root2基準へ
      startCTs.forEach(ct => bhPatterns(sc1, ct, 4).forEach(pt => {
        if (pt.o.some(v => v === undefined)) return;
        const lastIn2 = pt.o[3] + diff;
        const dir = pt.k === "up" ? 1 : -1;
        const ct2 = bhNextCT(sc2.cts, lastIn2, dir);               // 次のコードのコードトーンへ半音・全音で着地
        const L2 = bhLadder(sc2.pcs);
        const half2 = Array.from({ length: 4 }, (_, k) => bhWalk(L2, ct2, dir * k));
        if (half2.some(v => v === undefined)) return;
        const offs = [...pt.o, ...half2];
        const hint = `${hint1} | ${bhHint(chord2, sc2)}`;
        cells.push({ cat: `BarryHarris ${sc1.name}→${sc2.name} ${pt.k}`, p: ["8", "8", "8", "8", "8", "8", "8", "8"],
          d: offs.map(v => "s" + v), authentic: true, bh: true, hint });
        // 2コードの小節は、各コードの頭（表拍）を残す形だけ使う
        if (useRests) ["nnnhnnnh", "nnnrnnnn", "nhnnnnnr"].forEach(mask => {
          const r = applyMask(offs, mask);
          cells.push({ cat: `BarryHarris ${sc1.name}→${sc2.name} ${pt.k} ${mask}`, p: r.p, d: r.d, authentic: true, bh: true, hint });
        });
      }));
      return cells;
    };

    // ── Minor Scales モード（ギター版トレーナーのLv3+から移植）：メロディックマイナー／ハーモニックマイナー ──
    // maj7はトライアドかメジャー・スケール。ドミナント7・マイナー・m7b5・dim7で、メロディックマイナー（MM）とハーモニックマイナー（HM）のモードを使う
    // pcs＝コードのルートから見たスケール音、ct＝コードトーン、color＝そのスケールらしい音（表拍に来てよい）、avoid＝表拍に置かない音、passing＝経過音としてだけ使う音
    const MM_PCS = [0, 2, 3, 5, 7, 9, 11], HM_PCS = [0, 2, 3, 5, 7, 8, 11];
    const shiftPcs = (arr, k) => arr.map(x => (x + k) % 12).sort((a, b) => a - b);   // 親スケールのルートがコードのルート+k
    const msScalesFor = (chord, next, focus) => {
      const q = chordQuality(chord.name);
      const t = String(chord.name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      const nm = (k) => PC_NAMES[(chord.rootPc + k) % 12];
      const out = [];
      const add = (fam, k, mode, o) => out.push({ fam, pcs: shiftPcs(fam === "MM" ? MM_PCS : HM_PCS, k), mode, par: { fam, root: (chord.rootPc + k) % 12 },
        hint: `${nm(k)} ${fam === "MM" ? "mel.min" : "har.min"}${mode ? "＝" + mode : ""}`, ...o });
      const nq = next ? chordQuality(next.name) : null;
      const down5 = next && ((next.rootPc - chord.rootPc + 12) % 12) === 5;      // 5度下（4度上）へ解決
      const downHalf = next && ((next.rootPc - chord.rootPc + 12) % 12) === 11;  // 半音下へ（裏コード）
      const wantMM = focus !== "HM", wantHM = focus !== "MM";
      if (q === "maj") {
        if (/#5|\+|aug/.test(t)) { add("MM", 9, "リディアン♯5", { ct: [0, 4, 8, 11], color: [2, 6, 9], avoid: [] }); return out; }
        const lyd = /#11|#4/.test(t);
        out.push({ fam: "MAJ", par: { fam: "MAJ", root: (chord.rootPc + (lyd ? 7 : 0)) % 12 }, pcs: lyd ? [0, 2, 4, 6, 7, 9, 11] : [0, 2, 4, 5, 7, 9, 11], hint: `${nm(0)} ${lyd ? "リディアン" : "メジャー・スケール"}`,
          ct: [0, 4, 7, t.includes("6") ? 9 : 11], color: [2, 9], avoid: lyd ? [] : [5] });
        out.push({ fam: "TRI", par: { fam: "MAJ", root: chord.rootPc }, pcs: [0, 4, 7], hint: `${nm(0)} トライアド`, ct: [0, 4, 7], color: [], avoid: [] });
        return out;
      }
      if (q === "dom") {
        const altName = /alt|b9|#9|b13|#5|\+/.test(t);
        if (!altName && (/#11/.test(t) || downHalf || (next && !down5))) {        // 解決しないドミナント・裏コード
          add("MM", 7, "リディアン♭7", { ct: [0, 4, 7, 10], color: [2, 6, 9], avoid: [] });
          if (!wantHM || !down5) return out;
        }
        const toMinor = nq === "min" || nq === "hdim" || nq === "dim";
        if (wantMM || !toMinor) {
          add("MM", 1, "オルタード", { ct: [0, 4, 10], color: [1, 3, 6, 8], avoid: [] });
          out.push({ fam: "PENT", par: { fam: "MM", root: (chord.rootPc + 1) % 12 }, pcs: shiftPcs([0, 3, 5, 7, 10], 3), hint: `${nm(3)}mペンタ＝オルタード`, ct: [10], color: [1, 3, 6, 8], avoid: [] });
        }
        if (wantMM && toMinor) add("MM", 5, "ミクソ♭6", { ct: [0, 4, 7, 10], color: [2, 8], avoid: [5] });
        if (wantHM) add("HM", 5, "フリジアン・ドミナント", { ct: [0, 4, 7, 10], color: [1, 8], avoid: [5] });
        return out;
      }
      if (q === "hdim") {
        if (wantMM) add("MM", 3, "ロクリアン♮2", { ct: [0, 3, 6, 10], color: [2, 5], avoid: [] });
        if (wantHM) add("HM", 10, "ロクリアン♮6", { ct: [0, 3, 6, 10], color: [5, 9], avoid: [1] });
        return out;
      }
      if (q === "dim") { add("HM", 1, "dim7（第7モード）", { ct: [0, 3, 6, 9], color: [1, 8], avoid: [] }); return out; }
      // マイナー：ii（次が4度上のドミナント）ならジャズ・マイナー（♮7は経過音だけ）。トニックのマイナーなら MM・HM どちらも
      const isII = next && nq === "dom" && down5 && !/maj|M7|6/.test(t);
      const m7 = /7|9|11/.test(t) && !/maj|M7/.test(t);                          // m7系では ♮7 は経過音としてだけ使う
      if (isII || wantMM) add("MM", 0, isII ? "m6の響き" : "", { ct: [0, 3, 7], color: m7 ? [2, 5, 9] : [2, 5, 9, 11], avoid: [], passing: m7 ? [11] : [] });
      if (!isII && wantHM) add("HM", 0, "", { ct: [0, 3, 7], color: m7 ? [2, 5, 8] : [2, 5, 8, 11], avoid: [], passing: m7 ? [11] : [] });
      if (!out.length) add("MM", 0, "", { ct: [0, 3, 7], color: [2, 5, 9], avoid: [] });
      return out;
    };
    // スケール上の何音目に動くか（累積）。8分×8
    const MS_PAT8 = [
      { k: "下降", s: [0, -1, -1, -1, -1, -1, -1, -1] },
      { k: "上昇", s: [0, 1, 1, 1, 1, 1, 1, 1] },
      { k: "アルペジオ↑→スケール↓", s: [0, 2, 2, 2, -1, -1, -1, -1] },
      { k: "スケール↓→アルペジオ↑", s: [0, -1, -1, -1, -1, 2, 2, 2] },
      { k: "アルペジオ↓→スケール↑", s: [0, -2, -2, -2, 1, 1, 1, 1] },
      { k: "1-2-3-5", s: [0, 1, 1, 2, -1, -1, -1, -2] },
      { k: "3度の下降", s: [0, 2, -3, 2, -3, 2, -3, 2] },
      { k: "3度の上昇", s: [0, -2, 3, -2, 3, -2, 3, -2] },
      { k: "ターン", s: [0, 1, -1, -1, 1, 2, 2, -1] }
    ];
    const MS_PAT_TRI = [
      { k: "トライアド↑↓", s: [0, 1, 1, 1, -1, -1, -1, -1] },
      { k: "トライアド↓↑", s: [0, -1, -1, -1, 1, 1, 1, 1] },
      { k: "トライアド折り返し", s: [0, 1, -1, 2, -1, 2, -1, -1] },
      { k: "トライアドの波", s: [0, 2, -1, 2, -1, -1, -1, 1] }
    ];
    const MS_PAT4 = [
      { k: "下降", s: [0, -1, -1, -1] }, { k: "上昇", s: [0, 1, 1, 1] },
      { k: "アルペジオ↑", s: [0, 2, 2, -1] }, { k: "アルペジオ↓", s: [0, -2, -2, 1] }, { k: "1-2-3-5", s: [0, 1, 1, 2] }
    ];
    const msWalk = (sc, startPc, pat) => {
      const L = bhLadder(sc.pcs);
      let i = L.indexOf(startPc); if (i < 0) return null;
      const o = [];
      for (const st of pat.s) { i += st; if (i < 0 || i >= L.length) return null; o.push(L[i]); }
      return o;
    };
    // 表拍（0,2,4,6）にアボイドを置かない・コードトーンかカラーを3つ以上・経過音は前後が2半音以内
    const msLineOk = (sc, o, strongIdx) => {
      const pc = (v) => ((v % 12) + 12) % 12;
      let good = 0;
      for (const i of strongIdx) {
        const x = pc(o[i]);
        if ((sc.avoid || []).includes(x) || (sc.passing || []).includes(x)) return false;
        if (sc.ct.includes(x) || sc.color.includes(x)) good++;
      }
      if (good < Math.ceil(strongIdx.length * 0.7)) return false;
      for (let i = 0; i < o.length; i++) {
        if (!(sc.passing || []).includes(pc(o[i]))) continue;
        if ((i > 0 && Math.abs(o[i] - o[i - 1]) > 2) || (i < o.length - 1 && Math.abs(o[i + 1] - o[i]) > 2)) return false;
      }
      for (let i = 1; i < o.length; i++) if (o[i] === o[i - 1]) return false;
      if (sc.color.length && !o.some(v => sc.color.includes(pc(v)))) return false;   // そのスケールらしい音を1つは入れる
      return true;
    };
    const msStarts = (sc) => { const st = sc.ct.length ? sc.ct : sc.color; return [...st, ...st.map(c => c + 12)].filter(v => sc.pcs.includes(((v % 12) + 12) % 12)); };
    const makeMinorScaleCells = (chord1, chord2, twoChords, useRests, nextChord, focus) => {
      const cells = [];
      if (!twoChords) {
        msScalesFor(chord1, nextChord, focus).forEach(sc => {
          const pats = sc.fam === "TRI" ? MS_PAT_TRI : MS_PAT8;
          msStarts(sc).forEach(st => pats.forEach(pt => {
            const o = msWalk(sc, st, pt);
            if (!o || !msLineOk(sc, o, [0, 2, 4, 6])) return;
            const cat = `MinorScale ${sc.hint} ${pt.k}`;
            cells.push({ cat, p: ["8", "8", "8", "8", "8", "8", "8", "8"], d: o.map(v => "s" + v), authentic: true, ms: true, hint: sc.hint, msParents: [sc.par] });
            if (useRests) [...REST_MASKS].sort(() => Math.random() - 0.5).slice(0, 2).forEach(mask => {
              const r = applyMask(o, mask);
              if (r.d.length >= 4) cells.push({ cat: `${cat} ${mask}`, p: r.p, d: r.d, authentic: true, ms: true, hint: sc.hint, msParents: [sc.par] });
            });
          }));
        });
        return cells;
      }
      // 1小節2コード：前半4音は chord1 のスケール、後半4音は chord2 のスケールで、同じ向きに続ける
      const diff = ((chord1.rootPc - chord2.rootPc) + 12) % 12;
      const scs1 = msScalesFor(chord1, chord2, focus).filter(sc => sc.fam !== "TRI" && sc.fam !== "PENT");
      const scs2 = msScalesFor(chord2, nextChord, focus).filter(sc => sc.fam !== "TRI" && sc.fam !== "PENT");
      scs1.forEach(sc1 => scs2.forEach(sc2 => msStarts(sc1).forEach(st => MS_PAT4.forEach(pt => {
        const o1 = msWalk(sc1, st, pt);
        if (!o1 || !msLineOk({ ...sc1, color: [] }, o1, [0, 2])) return;
        const dir = pt.s[3] >= 0 && pt.k !== "アルペジオ↑" ? 1 : -1;
        const last = o1[3] + diff;
        // 次のコードのコードトーンへ半音・全音で着地
        let st2 = null;
        for (let k = 1; k <= 2 && st2 === null; k++) { const c = last + dir * k; if (sc2.ct.includes(((c % 12) + 12) % 12)) st2 = c; }
        if (st2 === null) return;
        MS_PAT4.forEach(pp => {
          const o2 = msWalk(sc2, st2, pp);
          if (!o2 || !msLineOk({ ...sc2, color: [] }, o2, [0, 2]) || o2[0] === o1[3] + diff) return;
          const offs = [...o1, ...o2];
          if (sc1.color.length + sc2.color.length && ![...o1.map(v => [sc1, v]), ...o2.map(v => [sc2, v])].some(([sc, v]) => sc.color.includes(((v % 12) + 12) % 12))) return;
          const hint = `${sc1.hint} | ${sc2.hint}`;
          const cat = `MinorScale ${hint} ${pt.k}/${pp.k}`;
          cells.push({ cat, p: ["8", "8", "8", "8", "8", "8", "8", "8"], d: offs.map(v => "s" + v), authentic: true, ms: true, hint, msParents: [sc1.par, sc2.par] });
          if (useRests) ["nnnhnnnh", "nnnrnnnn", "nhnnnnnr"].forEach(mask => {
            const r = applyMask(offs, mask);
            cells.push({ cat: `${cat} ${mask}`, p: r.p, d: r.d, authentic: true, ms: true, hint, msParents: [sc1.par, sc2.par] });
          });
        });
      }))));
      return cells;
    };

    // ── Triad Pair モード（ギター版トレーナーのLv4から移植）：トライアド・ペア（共通音のない2つのメジャー・トライアドで6音を作る）──
    // 値＝コードのルートから見たトライアドのルート（半音）。どちらもメジャー・トライアド
    const triadPairsFor = (chord) => {
      const t = String(chord.name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      if (chord.isDim && !t.includes("m7b5")) return [{ r: [8, 2], name: "dim" }];                  // C#dim7 → A + Eb
      if (t.includes("m7b5") || t.includes("ø")) return [{ r: [6, 8], name: "locrian" }];          // Bm7b5 → F + G
      if (chord.isMinor) return [{ r: [3, 5], name: "dorian" }];                                    // Dm7 → F + G
      if (chord.isV7) return [{ r: [10, 0], name: "mixolydian" }, { r: [6, 8], name: "altered" }];  // G7 → F + G ／ Db + Eb
      return [{ r: [0, 2], name: "lydian" }];                                                       // Cmaj7 → C + D
    };
    const triadPcs = (root) => [0, 4, 7].map(x => (root + x) % 12);
    // 指定トライアドの音で v より上（dir=1）／下（dir=-1）の一番近い音
    const nextInTriad = (pcs, v, dir) => { for (let k = 1; k <= 12; k++) { const c = v + dir * k; if (pcs.includes(((c % 12) + 12) % 12)) return c; } return v; };
    const tpLine = (A, B, start, group, n, dir, zigzag) => {
      // group 音ずつ A→B→A… と切り替える。zigzag なら1グループごとに向きを反転
      const out = [start]; let cur = start, tri = 0, inGroup = 1, d = dir;
      while (out.length < n) {
        if (inGroup >= group) { tri = 1 - tri; inGroup = 0; if (zigzag) d = -d; }
        cur = nextInTriad(tri === 0 ? A : B, cur, d);
        out.push(cur); inGroup++;
      }
      return out;
    };
    const makeTriadPairCells = (chord1, chord2, twoChords, useRests = true) => {
      const cells = [];
      const pairs = triadPairsFor(chord1);
      pairs.forEach(pr => {
        const A = triadPcs(pr.r[0]), B = triadPcs(pr.r[1]);
        const hint = `${PC_NAMES[(chord1.rootPc + pr.r[0]) % 12]}+${PC_NAMES[(chord1.rootPc + pr.r[1]) % 12]}`;
        const starts = [];
        for (let v = 0; v < 24; v++) if (A.includes(v % 12)) starts.push(v);
        if (twoChords) {
          // 前半だけトライアド・ペア、後半は次のコードのペアへ近い音で続ける
          const pr2 = triadPairsFor(chord2)[0];
          const A2 = triadPcs(pr2.r[0]), B2 = triadPcs(pr2.r[1]);
          const diff = ((chord1.rootPc - chord2.rootPc) + 12) % 12;
          const hint2 = `${hint} | ${PC_NAMES[(chord2.rootPc + pr2.r[0]) % 12]}+${PC_NAMES[(chord2.rootPc + pr2.r[1]) % 12]}`;
          starts.forEach(st => [1, -1].forEach(dir => {
            const h1 = tpLine(A, B, st, 2, 4, dir, false);
            const s2 = nextInTriad(A2, h1[3] + diff, dir);
            const h2 = tpLine(A2, B2, s2, 2, 4, dir, false);
            const o = [...h1, ...h2];
            cells.push({ cat: `TriadPair ${pr.name} 2+2`, p: ["8","8","8","8","8","8","8","8"], d: o.map(v => "s" + v), authentic: true, tp: true, hint: hint2 });
            if (useRests) ["nnnhnnnh", "nnnrnnnn", "nhnnnnnr"].forEach(mask => {
              const r = applyMask(o, mask);
              cells.push({ cat: `TriadPair ${pr.name} 2+2 ${mask}`, p: r.p, d: r.d, authentic: true, tp: true, hint: hint2 });
            });
          }));
          return;
        }
        starts.forEach(st => [1, -1].forEach(dir => {
          const shapes = [
            { k: "3+3", o: tpLine(A, B, st, 3, 8, dir, false), p: Array(8).fill("8") },
            { k: "2+2", o: tpLine(A, B, st, 2, 8, dir, false), p: Array(8).fill("8") },
            { k: "3+3 zigzag", o: tpLine(A, B, st, 3, 8, dir, true), p: Array(8).fill("8") },
            // 3連符：1拍ごとにトライアドを切り替える（ラーゲ・ルンドがよく使う形）
            { k: "triplets", o: tpLine(A, B, st, 3, 12, dir, false), p: Array(12).fill("trip8") },
            { k: "triplets arch", o: null, p: Array(12).fill("trip8"), arch: true }
          ];
          shapes.forEach(sh => {
            let o = sh.o;
            if (sh.arch) {  // 上がった頂点から、同じトライアドの切り替えで下りる
              const up = tpLine(A, B, st, 3, 6, dir, false);
              const down = tpLine(B, A, nextInTriad(B, up[5], -dir), 3, 6, -dir, false);
              o = [...up, ...down];
            }
            if (Math.max(...o) - Math.min(...o) > 26) return;
            cells.push({ cat: `TriadPair ${pr.name} ${sh.k}`, p: sh.p, d: o.map(v => "s" + v), authentic: true, tp: true, hint });
            if (useRests && sh.p.length === 8) {
              [...REST_MASKS].sort(() => Math.random() - 0.5).slice(0, 2).forEach(mask => {
                const r = applyMask(o, mask);
                cells.push({ cat: `TriadPair ${pr.name} ${sh.k} ${mask}`, p: r.p, d: r.d, authentic: true, tp: true, hint });
              });
            }
          });
        }));
      });
      return cells;
    };

    const hasSixteenth = (cell) => [...cell.p, ...(cell.p2 || [])].some(x => x === "16" || x === "trip16");

    // 音価の解決（完コピ譜面・アドリブ生成の両方で共通利用）
    const resolveDuration = (durType, tripCounter) => {
      let durBeat = 0.5, abcDur = "", isRest = false, prefix = "", tiedTail = false;
      if (durType === "z8") { isRest = true; durBeat = 0.5; abcDur = "z"; }
      else if (durType === "z4") { isRest = true; durBeat = 1.0; abcDur = "z2"; }
      else if (durType === "z2") { isRest = true; durBeat = 2.0; abcDur = "z4"; }
      else if (durType === "z1") { isRest = true; durBeat = 4.0; abcDur = "z8"; }
      else if (durType === "z16") { isRest = true; durBeat = 0.25; abcDur = "z/2"; }
      else if (durType === "4") { durBeat = 1.0; abcDur = "2"; }
      else if (durType === "4.") { durBeat = 1.5; abcDur = "3"; }
      else if (durType === "2.5") { durBeat = 2.5; abcDur = "4-"; tiedTail = true; } // 2分音符＋タイ8分音符
      else if (durType === "2") { durBeat = 2.0; abcDur = "4"; }
      else if (durType === "2.") { durBeat = 3.0; abcDur = "6"; }
      else if (durType === "2..") { durBeat = 3.5; abcDur = "7"; }
      else if (durType === "1") { durBeat = 4.0; abcDur = "8"; }
      else if (durType === "q8") { // 5連符（8分×5＝2拍）
        durBeat = 0.4; abcDur = "";
        if (tripCounter === 0) prefix = "(5:4:5";
        tripCounter = (tripCounter + 1) % 5;
      }
      else if (durType === "8") { durBeat = 0.5; abcDur = ""; }
      else if (durType === "16") { durBeat = 0.25; abcDur = "/2"; }
      else if (durType === "32") { durBeat = 0.125; abcDur = "/4"; }
      else if (durType === "trip8") {
        durBeat = 1 / 3; abcDur = "";
        if (tripCounter === 0) prefix = "(3";
        tripCounter = (tripCounter + 1) % 3;
      } else if (durType === "trip16") {
        durBeat = 1 / 6; abcDur = "/2";
        if (tripCounter === 0) prefix = "(3";
        tripCounter = (tripCounter + 1) % 3;
      }
      return { durBeat, abcDur, isRest, prefix, tiedTail, tripCounter };
    };

    // 重み付きランダム選択（Donna Lee由来フレーズを優先）
    const pickWeighted = (list) => {
      const w = list.map(c => (c.cell && typeof c.cell.w === "number") ? c.cell.w : ((c.cell && c.cell.authentic) ? DONNA_WEIGHT : 1));
      let r = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
      return list[list.length - 1];
    };

    const midiToAbcByKey = (midi, keySig, measureAccRef, spell) => {
      const flats = KEY_FLATS[keySig] || [];
      const sharps = KEY_SHARPS[keySig] || [];
      // spell: "b"=♭表記 / "#"=♯表記 / 未指定=調号に従う
      const useFlat = spell === "b" ? true : (spell === "#" ? false : flats.length > 0);
      const pitchClass = midi % 12;
      const oct = Math.floor(midi / 12);

      let baseName = "";
      let targetState = "natural";

      switch (pitchClass) {
        case 0:  baseName = "C"; targetState = "natural"; break;
        case 1:  baseName = useFlat ? "D" : "C"; targetState = useFlat ? "flat" : "sharp"; break;
        case 2:  baseName = "D"; targetState = "natural"; break;
        case 3:  baseName = useFlat ? "E" : "D"; targetState = useFlat ? "flat" : "sharp"; break;
        case 4:  baseName = "E"; targetState = "natural"; break;
        case 5:  baseName = "F"; targetState = "natural"; break;
        case 6:  baseName = useFlat ? "G" : "F"; targetState = useFlat ? "flat" : "sharp"; break;
        case 7:  baseName = "G"; targetState = "natural"; break;
        case 8:  baseName = useFlat ? "A" : "G"; targetState = useFlat ? "flat" : "sharp"; break;
        case 9:  baseName = "A"; targetState = "natural"; break;
        case 10: baseName = useFlat ? "B" : "A"; targetState = useFlat ? "flat" : "sharp"; break;
        case 11: baseName = "B"; targetState = "natural"; break;
      }

      let abc = baseName;
      const abcOctave = Math.floor(midi / 12) - 1; // MIDI 60 => 4, MIDI 48 => 3, MIDI 36 => 2, MIDI 24 => 1
      if (abcOctave <= 1) abc = baseName + ",,,";
      else if (abcOctave === 2) abc = baseName + ",,";
      else if (abcOctave === 3) abc = baseName + ",";
      else if (abcOctave === 4) abc = baseName;
      else if (abcOctave === 5) abc = baseName.toLowerCase();
      else if (abcOctave === 6) abc = baseName.toLowerCase() + "'";
      else abc = baseName.toLowerCase() + "''";

      const defaultState = flats.includes(baseName) ? "flat" : (sharps.includes(baseName) ? "sharp" : "natural");
      const key = baseName + oct;
      const currentState = measureAccRef[key] !== undefined ? measureAccRef[key] : defaultState;

      let prefix = "";
      if (targetState !== currentState) {
        if (targetState === "flat") prefix = "_";
        else if (targetState === "sharp") prefix = "^";
        else if (targetState === "natural") prefix = "=";
        measureAccRef[key] = targetState;
      }

      return prefix + abc;
    };

    // 4弦ベースTABフレット計算 (最大6フレット圏内のボックスポジション＆2ボックス連結最適化)
    const getTabForNote = (midi, isHarm, boxStart, forceString = -1, prevTab = null) => {
      if (isHarm) {
        // 実音MIDI（およびピッチクラス）が完全に一致するナチュラル・ハーモニクスを検索
        let exactMatches = NATURAL_HARMONICS.filter(h => h.midi === midi);
        if (exactMatches.length === 0) {
          exactMatches = NATURAL_HARMONICS.filter(h => h.pc === (midi % 12));
        }
        if (exactMatches.length > 0) {
          let bestH = null;
          const refFret = (prevTab && prevTab.fretNum) ? prevTab.fretNum : 7;
          exactMatches.forEach(h => {
            let score = Math.abs(h.fretNum - refFret) * 0.8 + Math.abs(h.midi - midi) * 2;
            if (prevTab && prevTab.stringIdx !== undefined) {
              score += Math.abs(h.stringIdx - prevTab.stringIdx) * 1.2;
            }
            if (!bestH || score < bestH.score) {
              bestH = { stringIdx: h.stringIdx, fret: h.fret, fretNum: h.fretNum, score };
            }
          });
          return bestH;
        }
      }

      const boxEnd = boxStart + 4; // 5フレット圏内 (例: 5F〜9F)
      const boxCenter = boxStart + 2;
      let best = null;

      for (let s = 3; s >= 0; s--) {
        const fret = midi - BASS_STRINGS[s];
        if (fret >= 0 && fret <= 20) {
          let score = 0;

          if (fret === 0) {
            // 開放弦は押弦できる別の弦・フレットがあるなら極力使わない（ソロでのポジション移動・ミュート・音色の統一のため）
            // 他に弾ける場所がない音（E1）だけは開放弦を許容する
            const hasAlt = BASS_STRINGS.some((open, s2) => s2 !== s && midi - open >= 1 && midi - open <= 20);
            score += hasAlt ? 200 : 0;
          } else if (fret >= boxStart && fret <= boxEnd) {
            // 6フレット圏内のボックスに収まっている場合
            score += Math.abs(fret - boxCenter) * 0.6;
            if (fret === boxStart || fret === boxEnd) score += 0.6; // 4〜5フレット幅のコア領域をさらに優遇
          } else {
            // 6フレット圏外にはみ出す場合は重いペナルティを課す
            const over = fret < boxStart ? (boxStart - fret) : (fret - boxEnd);
            score += 25 + over * 12;
          }

          // 強制弦指定があっても、ボックスから大きく外れる(2弦1F等になる)場合はボックス内の弦への切り替えを許容する
          if (forceString !== -1 && s !== forceString) {
            score += 12;
          }

          // 直前の音との弦・フレットの繋がりを滑らかにする
          if (prevTab && prevTab.fretNum !== null && prevTab.fretNum !== undefined) {
            score += Math.abs(fret - prevTab.fretNum) * 0.45;
            const strDiff = Math.abs(s - prevTab.stringIdx);
            if (strDiff > 1) score += (strDiff - 1) * 5;
          }

          if (!best || score < best.score) {
            best = { stringIdx: s, fret: String(fret), fretNum: fret, score };
          }
        }
      }
      
      if (!best) return { stringIdx: 0, fret: "0", fretNum: 0, score: 999 };
      return best;
    };

    // 添付ファイル（arpeggio solo etude.html）と同じピアノボイシング伴奏生成
    const getPianoVoicing = (chord, keySig, accRef) => {
      const rPc = chord.rootPc;
      const thirdPc = rPc + (chord.isMinor || chord.isDim ? 3 : 4);
      const seventhPc = rPc + (chord.isMajor ? 11 : 10);

      // C3(48) 付近のルート、C4(60) 付近の3度・7度
      const r = midiToAbcByKey(48 + (rPc % 12), keySig, accRef);
      const t = midiToAbcByKey(60 + (thirdPc % 12), keySig, accRef);
      const s = midiToAbcByKey(60 + (seventhPc % 12), keySig, accRef);

      return `[${r}${t}${s}]4`;
    };

    // ============ TAB運指プランナー（ボックスポジション最適化） ============
    // ・ボックス = 連続5フレット（b 〜 b+4）。フレーズの塊は必ず1つのボックス内に収める
    // ・ボックス移動（ポジションチェンジ）は動的計画法で最小回数・最短距離にし、
    //   「長い音や休符のあと」「同じ弦での1〜2フレットのスライド」「音型の進行方向と同じ向き」で行うよう誘導する
    const TAB_BOX_SPAN = 3;       // 基本ボックス = b..b+3 の4フレット（1フレット1指）。5フレット目以降は「寄り道」扱い
    const TAB_MAX_BOX = 16;
    const POSITION_ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX"];

    const BASS_MAX_FRET = 20;
    // ============ 7ポジション・システム（本吉大我氏） ============
    // （ギター版トレーナーから移植。ベースは4弦すべて4度チューニングなので、ギターの2弦のような調整はなし）
    // 7音スケールを、4弦（E弦）の開始音（スケールの何音目から始めるか）で7つのポジションに分ける。
    // 各弦3音ずつ順に上がる（4弦×3音＝12音、だいたい5〜6フレットの範囲）。
    // メジャー系はイオニアン〜ロクリアンの7つ（ナチュラルマイナーはエオリアン・ポジションとして区別しない）
    const POS_FAMS = {
      MAJ: { pcs: [0, 2, 4, 5, 7, 9, 11], names: ["Ion", "Dor", "Phr", "Lyd", "Mix", "Aeo", "Loc"],
        full: ["Ionian", "Dorian", "Phrygian", "Lydian", "Mixolydian", "Aeolian", "Locrian"], label: "メジャー" },
      MM: { pcs: [0, 2, 3, 5, 7, 9, 11], names: ["MM", "Dor♭2", "Lyd♯5", "Lyd♭7", "Mix♭13", "Aeo♭5", "Alt"],
        full: ["Melodic minor", "Dorian ♭2", "Lydian ♯5", "Lydian ♭7", "Mixolydian ♭13", "Aeolian ♭5", "Altered"], label: "メロディックマイナー" },
      HM: { pcs: [0, 2, 3, 5, 7, 8, 11], names: ["HM", "Loc♮6", "Ion♯5", "Dor♯4", "PhrD", "Lyd♯2", "Alt♭♭7"],
        full: ["Harmonic minor", "Locrian ♮6", "Ionian ♯5", "Dorian ♯4", "Phrygian dominant", "Lydian ♯2", "Altered ♭♭7"], label: "ハーモニックマイナー" }
    };
    const _posCache = {};
    const sevenPositions = (par) => {
      const key = par.fam + par.root;
      if (_posCache[key]) return _posCache[key];
      const fam = POS_FAMS[par.fam], out = [];
      const ladder = []; for (let m = 28; m <= 90; m++) if (fam.pcs.includes(((m - par.root) % 12 + 12) % 12)) ladder.push(m);
      for (let k = 0; k < 7; k++) {
        const startPc = (par.root + fam.pcs[k]) % 12;
        for (let f0 = ((startPc - 4) % 12 + 12) % 12; f0 <= BASS_MAX_FRET; f0 += 12) {
          let i = ladder.indexOf(BASS_STRINGS[0] + f0);
          const cells = [];
          for (let st = 0; st < 4; st++) {
            for (let n = 0; n < 3; n++, i++) cells.push({ s: st, f: ladder[i] - BASS_STRINGS[st], midi: ladder[i] });
          }
          const frets = cells.map(c => c.f);
          const min = Math.min(...frets), max = Math.max(...frets);
          if (min < 1 || max > BASS_MAX_FRET) continue;
          out.push({ key: `${key}-${k}-${f0}`, par, k, min, max, set: new Set(cells.map(c => c.s + ":" + c.f)),
            name: `${PC_NAMES[startPc]} ${fam.names[k]}(${PC_NAMES[par.root]})`, full: `${PC_NAMES[startPc]} ${fam.full[k]}（${PC_NAMES[par.root]} ${fam.label}）` });
        }
      }
      return (_posCache[key] = out);
    };
    // コードから「どのスケールのポジションで弾くか」（親スケール）を決める。前と同じ親スケールで済むならそれを続ける
    const chordParent = (name, prevName, nextName, prevParent) => {
      const c = parseChord(name), q = chordQuality(name), r = c.rootPc;
      const t = String(name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      const P = (fam, k) => ({ fam, root: (r + k) % 12 });
      const iv = (a, b) => ((parseChord(b).rootPc - parseChord(a).rootPc) % 12 + 12) % 12;
      let cands;
      if (q === "maj") cands = /#5|\+|aug/.test(t) ? [P("MM", 9)] : /#11/.test(t) ? [P("MAJ", 7)] : [P("MAJ", 0), P("MAJ", 7)];
      else if (q === "dom") {
        const toMinor = nextName && ["min", "hdim"].includes(chordQuality(nextName)) && iv(name, nextName) === 5;
        cands = /alt|b9|#9|b13|#5|\+/.test(t) ? [P("MM", 1)] : /#11/.test(t) ? [P("MM", 7)] : toMinor ? [P("HM", 5), P("MAJ", 5)] : [P("MAJ", 5)];
      }
      else if (q === "hdim") cands = [P("MAJ", 1), P("MM", 3), P("HM", 10)];
      else if (q === "dim") cands = [P("HM", 1)];
      else if (/6|maj|M7/.test(t)) cands = [P("MM", 0)];
      else {
        const afterV = prevName && chordQuality(prevName) === "dom" && iv(prevName, name) === 5;
        cands = afterV ? [P("MAJ", 3), P("MAJ", 10)] : [P("MAJ", 10), P("MAJ", 3), P("MAJ", 8)];
      }
      if (prevParent) { const m = cands.find(x => x.fam === prevParent.fam && x.root === prevParent.root); if (m) return m; }
      return cands[0];
    };
    // 曲全体のコード進行から、小節（前半・後半）ごとの親スケールを決める
    const planParents = (chordBars) => {
      const flat = [];
      chordBars.forEach((bar, bi) => String(bar || "").split(/\s+/).filter(Boolean).forEach((nm, h) => flat.push({ bi, h, nm })));
      const plan = chordBars.map(() => []);
      let prev = null;
      flat.forEach((x, i) => {
        const pn = flat[(i - 1 + flat.length) % flat.length].nm, nn = flat[(i + 1) % flat.length].nm;
        prev = chordParent(x.nm, i > 0 ? pn : null, nn, prev);
        plan[x.bi][x.h] = prev;
      });
      return plan;
    };

    const tabTransitionCost = (p, c, gap) => {
      let cost = 0;
      const sd = Math.abs(p.stringIdx - c.stringIdx);
      if (sd > 1) cost += (sd - 1) * 4;                              // 弦飛びは控えめに
      if (p.midi === c.midi && (p.stringIdx !== c.stringIdx || p.fretNum !== c.fretNum)) cost += 6; // 同音連打は同じ場所で
      const bothPos = !!(p.posKey && c.posKey);
      const moved = bothPos ? p.posKey !== c.posKey : p.box !== c.box;
      if (moved && bothPos && p.par && c.par && (p.par.fam !== c.par.fam || p.par.root !== c.par.root) && Math.abs(c.box - p.box) <= 1) {
        cost += 1.2;                                                  // コードが変わってスケールが変わっただけ（手の位置はほぼ同じ）
      } else if (moved) {
        const d = Math.abs(c.box - p.box);
        let sc = 10 + d * 1.0;                                        // ポジション移動の基本コスト（距離に比例）
        if (gap >= 1) sc -= 3;                                       // 長い音・休符のあとは移動しやすい
        else if (gap < 0.45) sc += 2.5;                              // 16分・3連の途中では移動しない
        if (p.free || c.free) sc -= 2;                               // 開放弦・ハーモニクスの間は移動しやすい
        else {
          const pitchDir = Math.sign(c.midi - p.midi), boxDir = Math.sign(c.box - p.box);
          if (p.stringIdx === c.stringIdx && Math.abs(c.fretNum - p.fretNum) <= 2 && pitchDir === boxDir && !p.out && !c.out) {
            sc -= 2;                         // 同じ弦で1〜2フレット滑らせてボックスを連結（最もスムーズ）
          }
          if (pitchDir !== 0 && pitchDir !== boxDir) sc += 3;        // 音型の進行方向と逆向きの移動は避ける
          sc += Math.max(0, Math.abs(c.fretNum - p.fretNum) - 2) * 0.6; // 移動時も左手の実際の移動量は小さく
        }
        cost += Math.max(1.5, sc);
      } else if (!p.free && !c.free) {
        cost += Math.abs(c.fretNum - p.fretNum) * 0.15;
        if (p.out && c.out) cost += 3;                               // 寄り道が続くならボックスごと移動する
      }
      return cost;
    };

    // notes: [{midi, isHarm, beatPos}]  carry: 直前の小節の最後の状態（なければnull）  getForce: 強制弦（メカニカル用）
    const planMeasureTab = (ownNotes, carry, absBeatBase, getForce, lookahead = []) => {
      if (ownNotes.length === 0) return { tabs: [], cost: 0, last: carry };
      const notes = ownNotes.concat(lookahead); // 次の小節も見越して最適化し、確定するのは自分の小節だけ
      const layers = notes.map((n, idx) => {
        const force = getForce ? getForce(n, idx) : -1;
        const cands = [];
        if (n.isHarm) {
          let matches = NATURAL_HARMONICS.filter(h => h.midi === n.midi);
          if (matches.length === 0) matches = NATURAL_HARMONICS.filter(h => h.pc === (n.midi % 12));
          matches.forEach(h => cands.push({ stringIdx: h.stringIdx, fret: h.fret, fretNum: h.fretNum, free: true, base: Math.abs(h.midi - n.midi) * 2 }));
        }
        if (cands.length === 0) {
          const fretted = [];
          let open = null;
          for (let s = 0; s < 4; s++) {
            const fret = n.midi - BASS_STRINGS[s];
            if (fret < 0 || fret > 20) continue;
            let base = 0;
            // 弾きやすい音域（およそ9F〜14F）を中心に。低すぎるポジションはフレット間隔が広く、高すぎると音がつまる
            base += Math.max(0, 9 - fret) * 0.4;
            base += Math.max(0, fret - 14) * 0.4;
            if (force !== -1 && s !== force) base += 12;
            if (fret === 0) open = { stringIdx: s, fret: "0", fretNum: 0, free: true, base };
            else fretted.push({ stringIdx: s, fret: String(fret), fretNum: fret, free: false, base });
          }
          // 開放弦は他に押さえられる場所がない音（E1）のときだけ使う
          if (fretted.length > 0) cands.push(...fretted); else if (open) cands.push(open);
        }
        if (cands.length === 0) cands.push({ stringIdx: 0, fret: "0", fretNum: 0, free: true, base: 50 });
        const states = [];
        // 7ポジション：親スケールが分かる音は、そのスケールの7つのポジションの中で置く
        if (n.parent && !n.isHarm && force === -1) {
          sevenPositions(n.parent).forEach(pos => cands.forEach(c => {
            if (c.free) return;
            let node = c.base, out = false;
            if (pos.set.has(c.stringIdx + ":" + c.fretNum)) { /* ポジションの形の中 */ }
            else if (c.fretNum >= pos.min && c.fretNum <= pos.max) node += 3;           // 形の外だが同じ手の範囲（半音のアプローチなど）
            else {
              const dist = c.fretNum < pos.min ? pos.min - c.fretNum : c.fretNum - pos.max;
              if (dist > 4) return;
              node += 8 + dist * 1.5; out = true;                                       // 一時的な寄り道
            }
            states.push({ ...c, box: pos.min, posKey: pos.key, posName: pos.name, posFull: pos.full, par: pos.par, out, midi: n.midi, node, absBeat: absBeatBase + n.beatPos });
          }));
        }
        if (states.length === 0) cands.forEach(c => {
          for (let b = 1; b <= TAB_MAX_BOX; b++) {
            let node = c.base;
            let out = false;
            if (!c.free) {
              const dist = c.fretNum < b ? b - c.fretNum : (c.fretNum > b + TAB_BOX_SPAN ? c.fretNum - (b + TAB_BOX_SPAN) : 0);
              if (dist > 7) continue;
              if (dist > 0) { node += 10 + dist * 1.0; out = true; }   // ボックス外への一時的な「寄り道」（手の位置は戻す前提）
            }
            states.push({ ...c, box: b, out, midi: n.midi, node, absBeat: absBeatBase + n.beatPos });
          }
        });
        return states;
      });

      // Viterbi
      let prevCosts = layers[0].map(st => {
        let c = st.node;
        if (carry) c += tabTransitionCost(carry, st, st.absBeat - carry.absBeat);
        else c += Math.abs(st.box - 4) * 0.1;                         // 曲頭はミドルポジション付近から
        return c;
      });
      const back = [layers[0].map(() => -1)];
      for (let i = 1; i < layers.length; i++) {
        const cur = layers[i], prev = layers[i - 1];
        const costs = new Array(cur.length), bk = new Array(cur.length);
        for (let j = 0; j < cur.length; j++) {
          let best = Infinity, bi = 0;
          const gap = cur[j].absBeat - prev[0].absBeat;
          for (let k = 0; k < prev.length; k++) {
            const v = prevCosts[k] + tabTransitionCost(prev[k], cur[j], gap);
            if (v < best) { best = v; bi = k; }
          }
          costs[j] = best + cur[j].node; bk[j] = bi;
        }
        prevCosts = costs; back.push(bk);
      }
      let bj = 0;
      for (let j = 1; j < prevCosts.length; j++) if (prevCosts[j] < prevCosts[bj]) bj = j;
      const total = prevCosts[bj];
      const tabs = new Array(layers.length);
      for (let i = layers.length - 1; i >= 0; i--) { tabs[i] = layers[i][bj]; bj = back[i][bj]; }
      const own = tabs.slice(0, ownNotes.length);
      return { tabs: own, cost: total, last: own[own.length - 1] };
    };

    // 4弦ベース専用SVG TAB譜コンポーネント
    // ══ ベースのコードメロディ ══════════════════════════════════
    // テーマのメロディ（実音MIDI）とコード進行から、メロディを一番上に保ったベース用コードメロディを作る
    // CM1 ルート＋メロディ ／ CM2 シェル（ルート＋3度か7度） ／ CM3 ダブルストップ（表拍はハモりの音を1つ下に）
    const CM_MODES = [
      { id: "CM1", label: "CM1 ルート＋メロディ", cm: 1, desc: "コードメロディ：コードが変わるところだけ、ルート音を一緒に弾く" },
      { id: "CM2", label: "CM2 シェル", cm: 2, desc: "コードメロディ：コードの頭はルート＋ガイドトーン（3度か7度）＋メロディ、強拍の長い音はガイドトーンを1つ下に足す" },
      { id: "CM3", label: "CM3 ダブルストップ", cm: 3, desc: "コードメロディ：CM2に加えて、表拍の音はほぼ全部ハモりの音（3度・6度・10度）を下に足す" }
    ];
    const CM_DUR_NAME = { 0.25: "16", 0.5: "8", 1: "4", 1.5: "4.", 2: "2", 3: "2.", 3.5: "2..", 4: "1" };
    const CM_BEATS = { "16": .25, "8": .5, "4": 1, "4.": 1.5, "2": 2, "2.": 3, "2..": 3.5, "1": 4, z16: .25, z8: .5, z4: 1, z2: 2, z1: 4 };
    const cmPcRel = (m, r) => ((m - r) % 12 + 12) % 12;
    const cmChordAt = (chordStr, beat) => { const parts = String(chordStr || "").split(/\s+/).filter(Boolean); return parts.length === 2 && beat >= 2 ? parts[1] : parts[0]; };
    const cmTones = (name) => {
      const q = chordQuality(name);
      const third = (q === "min" || q === "hdim" || q === "dim") ? 3 : 4;
      const fifth = (q === "hdim" || q === "dim") ? 6 : 7;
      const sev = q === "maj" ? 11 : (q === "dim" ? 9 : 10);
      return { third, fifth, sev, all: [0, third, fifth, sev] };
    };

    // 音の組（高い順）を弦に割り当てる候補 [{ tab:[[弦,フレット]...], cost, center }]
    const cmBassFingerings = (notes) => {
      const res = [];
      const rec = (i, maxS, acc) => {
        if (i === notes.length) {
          const fr = acc.map(x => x[1]).filter(f => f > 0);
          const lo = fr.length ? Math.min(...fr) : 0, hi = fr.length ? Math.max(...fr) : 0;
          if (hi - lo > 5) return;
          let cost = (hi - lo) * 0.6 + (hi - lo === 5 ? 2 : 0) + Math.max(0, hi - 12) * 0.25 + Math.max(0, hi - 17) * 1.2;
          for (let k = 1; k < acc.length; k++) cost += (acc[k - 1][0] - acc[k][0] - 1) * 0.7;   // 間の弦をミュートする手間
          if (notes.length > 1 && acc[0][0] < 2) cost += 2.5;                                   // 和音のときメロディはD弦かG弦で
          res.push({ tab: acc.slice(), cost, center: fr.length ? (lo + hi) / 2 : null, opens: acc.filter(x => x[1] === 0).length });
          return;
        }
        for (let s = maxS; s >= 0; s--) {
          const f = notes[i] - BASS_STRINGS[s];
          if (f < 0 || f > 20) continue;
          acc.push([s, f]); rec(i + 1, s - 1, acc); acc.pop();
        }
      };
      rec(0, 3, []);
      return res.sort((a, b) => a.cost - b.cost).slice(0, 6);
    };

    // メロディ音 m の下に置く音の候補（高い順、メロディは含まない）
    const cmBassVoicings = (m, chordName, kind) => {
      const ch = parseChord(chordName), r = ch.rootPc, T = cmTones(chordName), rel = cmPcRel(m, r);
      const roots = []; for (let b = MIN_BASS_MIDI; b <= m - 3; b++) if (cmPcRel(b, r) === 0) roots.push(b);
      const guides = [T.third, T.sev].filter(g => g !== rel);
      const below = (pcs, lo, hi) => { const out = []; for (let v = m - lo; v >= m - hi; v--) if (v >= MIN_BASS_MIDI && pcs.includes(cmPcRel(v, r))) out.push(v); return out; };
      const out = [];
      if (kind === "root" || kind === "shell") {
        roots.forEach(b => out.push({ notes: [b], cost: (m - b < 7 ? 2.5 : 0) + (m - b > 24 ? 1.5 : 0), style: "root" }));
      }
      if (kind === "shell") {
        roots.forEach(b => guides.forEach(g => below([g], 2, 22).forEach(v => {
          if (v > b + 2) out.push({ notes: [v, b], cost: -1.5 + (m - v < 3 ? 1 : 0) + (m - b > 26 ? 1.5 : 0), style: "shell" });
        })));
      }
      if (kind === "dbl" || kind === "guide") {
        below(guides, 3, 10).forEach(v => out.push({ notes: [v], cost: -1, style: "guide" }));
        if (kind === "dbl") below(T.all.filter(x => x !== rel), 3, 9).forEach(v => { if (!out.some(o => o.notes[0] === v)) out.push({ notes: [v], cost: 0, style: "dbl" }); });
        out.push({ notes: [], cost: 3, style: null });   // ハモりを足せないとき
      }
      if (!out.length) out.push({ notes: [], cost: 0, style: null });
      return out;
    };

    // 再生成のたびに少しずつ違うフィルになるよう、種（seed）付きの乱数を使う
    const cmRand = (seed) => { let a = (seed * 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

    // メロディが伸びている所・休符を埋めるフィル（ベースの低い音域）。戻り値 [{ dur, notes:[高い順] }]
    //  walk：4分のウォーキング（最後は次のコードのルートへ半音でアプローチ）
    //  arp ：8分のアルペジオ（上がる／下がる、最後はアプローチ）
    //  chord：ルート＋7度→ルート＋10度などの和音を刻む（内声が動く）
    // フィル用の「一節」：パーカー（Donna Lee）・コルトレーン・クリスチャンの実フレーズから、
    // 8分・3連・8分休符だけでできている1拍／2拍の切れ端を取り出す（音はコードのルートからの半音数）
    let CM_FILL_CELLS = null;
    const getFillCells = () => {
      if (CM_FILL_CELLS) return CM_FILL_CELLS;
      const BT = { "8": .5, "trip8": 1 / 3, "z8": .5 };
      const out = [], seen = new Set();
      PHRASE_DICTIONARY.forEach(c => {
        if (!c.authentic || c.span2 || c.q2 || !c.q || !/Parker|Christian|Coltrane/.test(c.cat)) return;
        if (!c.d.every(x => /^s-?\d+$/.test(x))) return;
        // 各音の開始拍と、音の番号
        let t = 0, ni = 0; const ev = [];
        for (const tk of c.p) {
          const d = BT[tk]; const ok = d !== undefined;
          ev.push({ t, tk, ok, dur: ok ? d : null, ni: tk.startsWith("z") ? null : ni });
          if (!tk.startsWith("z")) ni++;
          t += ok ? d : ({ "16": .25, "4": 1, "4.": 1.5, "2": 2, "2.": 3, "1": 4, "trip16": 1 / 6, "q8": .4, z16: .25, z4: 1, z2: 2 }[tk] || 0);
        }
        [[0, 1], [1, 1], [2, 1], [3, 1], [0, 2], [1, 2], [2, 2]].forEach(([s, L]) => {
          const w = ev.filter(e => e.t >= s - 1e-6 && e.t < s + L - 1e-6);
          if (!w.length || Math.abs(w[0].t - s) > 1e-6 || w.some(e => !e.ok)) return;
          const end = w[w.length - 1].t + w[w.length - 1].dur;

    const cmMakeFill = (type, startAbs, len, chordName, nextChordName, rnd, prevMidi = null) => {

        });

      }

          if (k === n - 1 && changes && n > 1 && rnd() < 0.6) { out.push({ ...slots[k], notes: [approach(R0)] }); break; }
          const up = ups[k % ups.length];

        }
        out.style = `フィル：和音の刻み（ルート＋7度・10度。上の声が動く） ${apText}`;
        return out;
      }
      let seq;
      const tones = [0, T.third, T.fifth, T.sev];
      if (type === "arp" && rnd() < 0.45) {        // 上から下りる
        const top = R0 + 12 + T.third;
        seq = []; let x = top;

        // ウォーキングは、いま弾いたルートと同じ音を避けて5度から始める

      }
      for (let k = 0; k < n; k++) {

        out.push({ ...slots[k], notes: [m] });
      }
      out.style = type === "arp" ? `フィル：8分のアルペジオ（コードトーン） ${apText}` : `フィル：4分のウォーキング（5度から） ${apText}`;

    };

    const arrangeBassChordMelody = (melodyBars, chordList, level, seed = 1) => {
      const rnd = cmRand(seed + level * 101);
      const nBars = melodyBars.length;
      const chordAtAbs = (abs) => { const bi = Math.min(nBars - 1, Math.floor(abs / 4 + 1e-9)); return cmChordAt(chordList[bi], abs - bi * 4); };
      // 0) 音域：メロディをオクターブ単位で下げて、ローポジション〜12F（D弦・G弦が中心）で弾ける高さに置く。
      //    ほとんどの音が55（G弦12F）以下に入る高さを選び、はみ出す数音だけ1オクターブ下げる
      const CM_TOP = 55;
      const allM = melodyBars.flat().filter(e => !String(e[0]).startsWith("z")).map(e => e[1]);
      let shift = 0;
      while (allM.filter(m => m + shift > CM_TOP).length > Math.max(1, allM.length * 0.03)) shift -= 12;
      const fold = (m) => (m + shift > CM_TOP ? m + shift - 12 : m + shift);
      // 1) メロディを曲全体の時間軸の出来事にする（タイはまとめ、コードの変わり目では弾き直す）
      let items = [];
      melodyBars.forEach((bar, bi) => {
        let beat = 0;
        bar.forEach(ev => {

          const abs = bi * 4 + beat, tieOut = String(ev[2] || "").includes("-");
          const last = items[items.length - 1];
          if (!rest && last && last.tieOut && !last.rest && last.midi === fold(ev[1]) && Math.abs(last.abs + last.dur - abs) < 1e-6) { last.dur += dur; last.tieOut = tieOut; }
          else items.push({ abs, dur, rest, midi: rest ? null : fold(ev[1]), tieOut });
          beat += dur;
        });
      });

      const cuts = []; for (let bi = 0; bi < nBars; bi++) { cuts.push(bi * 4); if (String(chordList[bi] || "").split(/\s+/).filter(Boolean).length === 2) cuts.push(bi * 4 + 2); }

        split.push({ ...it, abs: s, dur: e - s });

      const nextAttack = (i) => { for (let k = i + 1; k < items.length; k++) if (!items[k].rest) return items[k]; return items.find(x => !x.rest); };

          if (level === 2) return x < 0.65 ? "bebop" : x < 0.85 ? "triad" : "arp";

          if (list.length) return list;
          return cmBassFingerings([e.fixedNotes[e.fixedNotes.length - 1]]).map(fg => ({ notes: [e.fixedNotes[e.fixedNotes.length - 1]], tab: fg.tab, center: fg.center, opens: fg.opens, cost: fg.cost + 3 }));
        }
        cmBassVoicings(e.midi, e.chord, e.kind).forEach(v => {

      }

      let chordNo = 0;
      play.forEach(e => {
        if (e.fill || !e.choice || e.choice.notes.length < 2) return;
        const c = e.choice, chd = parseChord(e.chord), T = cmTones(e.chord);
        const lower = c.notes.slice(1), relOf = (m) => cmPcRel(m, chd.rootPc);
        const gName = (m) => relOf(m) === T.third ? "3度" : relOf(m) === T.sev ? "7度" : getDegreeLabelFromMidi(m, chd);
        let style;
        if (c.style === "root") style = "ルート＋メロディ（コードが変わる所）";
        else if (c.style === "shell") style = `シェル：ルート＋${gName(lower[0])}＋メロディ（コードが変わる所）`;
        else if (c.style === "guide") style = `ガイドトーン（${gName(lower[0])}）をメロディの${ivName(e.midi - lower[0])}下に`;
        else if (c.style === "dbl") style = `ハモり：メロディの${ivName(e.midi - lower[0])}下に${getDegreeLabelFromMidi(lower[0], chd)}`;

        e.info = { group: "c" + (chordNo++), style };
      });

      // 5) 小節線・書ける音価で区切って、完コピと同じ形（[音価, 高音部MIDI(+24) か 和音配列, "-"], 原譜TAB）にする
      const bars = melodyBars.map(() => []), tabs = melodyBars.map(() => []), infos = melodyBars.map(() => []);

      items.forEach(it => {

    // 4弦ベース用 SVG TAB譜（TAB主役：コード名・ポジション・リズム・休符・度数・再生位置をTAB上に表示）
    const REST_SHAPES = {
      // 休符の簡易図形（y基準: リズム欄の中央）
      quarter: (x, y) => <path d={`M${x-2},${y-9} L${x+3},${y-4} L${x-1},${y} L${x+3},${y+5} Q${x-3},${y+3} ${x},${y+9}`} fill="none" stroke="#475569" strokeWidth="1.6" />,
      eighth: (x, y) => <g><circle cx={x-2} cy={y-3} r="1.8" fill="#475569" /><path d={`M${x-2},${y-2} Q${x+1},${y-1} ${x+3},${y-4} L${x-1},${y+7}`} fill="none" stroke="#475569" strokeWidth="1.4" /></g>,
      sixteenth: (x, y) => <g><circle cx={x-2} cy={y-5} r="1.6" fill="#475569" /><circle cx={x-3} cy={y} r="1.6" fill="#475569" /><path d={`M${x+3},${y-6} L${x-2},${y+8}`} fill="none" stroke="#475569" strokeWidth="1.4" /></g>,
      half: (x, y) => <rect x={x-5} y={y-3} width="10" height="4" fill="#475569" />,
      whole: (x, y) => <rect x={x-5} y={y-1} width="10" height="4" fill="#475569" />
    };

    const CIRCLED = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩"];
    const BassTab = ({ measures, perLine = 4, startMeasure = 0, curBeat = -1, hideFrets = false, showDegrees = true, showChordInfo = false }) => {
      // 和音の説明：小節ごとに、同じグループ（続けて動かす和音など）をまとめて番号を振る

          groups[map[g]].degs.push(n.chordDesc.degs);
        });

      });

                  ))}

                  {(m.notes || []).map((n, nIdx) => {
                    const xPos = xOf(mStart, n.beatPos);

                      const x = xOf(mStart, parseFloat(k)) + 10, y = TOP + (3 - tops[k]) * GAP - 6;

                    const dotted = [1.5, 3, 0.75, 2.5].some(d => near(r.dur, d));
                    const g = groups[Math.floor(r.beatPos + 1e-6)];
                    const single = isShort(r.dur) && (!g || g.length < 2);

                    const x1 = xOf(mStart, g[0].beatPos), x2 = xOf(mStart, g[g.length - 1].beatPos);
                    const segs = [], segs3 = [];
                    for (let k = 0; k < g.length - 1; k++) {
                      if (is16(g[k].dur) && is16(g[k + 1].dur)) segs.push([xOf(mStart, g[k].beatPos), xOf(mStart, g[k + 1].beatPos)]);
                      if (is32(g[k].dur) && is32(g[k + 1].dur)) segs3.push([xOf(mStart, g[k].beatPos), xOf(mStart, g[k + 1].beatPos)]);
                    }
                    const trip = g.some(r => isTrip(r.dur));
                    return (
                      <g key={"b" + gi}>
                        <line x1={x1} y1={BEAM_Y} x2={x2} y2={BEAM_Y} stroke="#334155" strokeWidth="3" />
                        {segs.map(([a, b], si) => <line key={si} x1={a} y1={BEAM2_Y} x2={b} y2={BEAM2_Y} stroke="#334155" strokeWidth="3" />)}
                        {segs3.map(([a, b], si) => <line key={"t" + si} x1={a} y1={BEAM3_Y} x2={b} y2={BEAM3_Y} stroke="#334155" strokeWidth="3" />)}
                        {trip && <text x={(x1 + x2) / 2} y={BEAM_Y + 11} textAnchor="middle" fill="#334155" fontSize="10" fontWeight="700" fontStyle="italic">3</text>}
                      </g>
                    );
                  })}
                  {(m.rests || []).map((r, i) => {
                    const x = xOf(mStart, r.beatPos) + (r.dur >= 3.9 ? (measureWidth - 34) * 0.4 : 0);
                    const kind = r.dur >= 3.9 ? "whole" : r.dur >= 1.99 ? "half" : r.dur >= 0.99 ? "quarter" : r.dur >= 0.49 ? "eighth" : "sixteenth";
                    return <g key={"z" + i}>{REST_SHAPES[kind](x, REST_Y)}</g>;
                  })}

                  {showDegrees && mains.map((n, i) => n.label ? (
                    <text key={"d" + i} x={xOf(mStart, n.beatPos)} y={DEG_Y} textAnchor="middle" fill="#b45309"
                      fontSize={mains.length > 10 ? "9" : "10.5"} fontWeight="700" fontFamily="ui-monospace, monospace">{n.label}</text>
                  ) : null)}

                  <line x1={mStart + measureWidth} y1={TOP} x2={mStart + measureWidth} y2={BOTTOM}
                    stroke="#0f172a" strokeWidth={mIdx === measures.length - 1 && mIdx === perLine - 1 ? "2" : "1.3"} />
                </g>
              );
            })}
          </svg>
          {showChordInfo && legends.some(l => l.length > 0) && (
            <div className="grid gap-x-3 text-[11px] leading-snug text-violet-700 pb-1"
              style={{ gridTemplateColumns: `repeat(${perLine}, minmax(0, 1fr))`, paddingLeft: "3.6%", paddingRight: "0.7%" }}>
              {legends.map((gs, mIdx) => (
                <div key={mIdx} className="min-w-0">
                  {gs.map((g, k) => (
                    <div key={k} className="break-words">
                      <span className="font-extrabold">{CIRCLED[k] || "●"}</span>{" "}
                      {g.runName && <span className="font-bold">{g.runName}：</span>}
                      <span>{g.style}</span>
                      <span className="text-slate-500">{"　"}{g.degs.slice(0, 3).join(" → ")}{g.degs.length > 3 ? " …" : ""}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };


    function App() {

      // コードメロディのモード：テーマのメロディがある曲だけ。その場で編曲して完コピと同じ形で表示・再生する

      }, [currentSong, category, chords, cmSeed]);
      useEffect(() => {

      const playerRef = useRef({ ctx: null, bassGain: null, pianoGain: null, bass: null, piano: null, timing: null, started: false, primed: false, token: 0, totalMs: 0, live: true, custom: false, sources: [], bassBuf: null, pianoBuf: null, cOffset: 0, cT0: 0, cPlaying: false });
      const loopRef = useRef(false);

      const generateEtude = () => {

                      midi: realMidi,
